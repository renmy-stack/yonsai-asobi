<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>かげあて</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2d42">
<link rel="stylesheet" href="common.css?v=202609221919">
<link rel="stylesheet" href="game.css?v=202609221919">
<style>
  body { background: linear-gradient(180deg, #3a3d5c 0%, #5c5f80 100%); }
  .question { color: #fff; }
  .stars { color: #fff; }
  #shadowBox {
    flex: 1.2; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 28px;
    background: radial-gradient(circle at 50% 40%, #ffe9a8 0%, #ffd36b 70%);
    box-shadow: 0 6px 0 rgba(0,0,0,.2);
  }
  #shadowBox .face { width: 60%; height: 80%; display: block; }
  #shadowBox .face img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0) opacity(.85); transition: filter .5s; }
  #shadowBox.reveal .face img { filter: none; }
  #shadowBox .face.emoji { display: flex; align-items: center; justify-content: center; font-size: min(28vmin, 140px); filter: brightness(0) opacity(.85); }
  #shadowBox.reveal .face.emoji { filter: none; }
  .choices { flex: 1; }
</style>
</head>
<body>

<div id="start"><div class="big">🌙</div><div>タッチしてね</div></div>

<div id="stage">
  <div class="question" id="question">これは だれの かげ？</div>
  <div class="stars" id="stars"></div>
  <div id="shadowBox"></div>
  <div class="choices" id="choices"></div>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>
<button id="replay" class="topbtn right" type="button">🔊</button>

<script src="common.js?v=202609221919"></script>
<script src="catalog.js?v=202609221919"></script>
<script>
(() => {
  'use strict';
  const { SFX, say, burst, animate, cheer, celebrate, setupStart, setupHome, shuffle, pick } = Baby;
  const box = document.getElementById('shadowBox');
  const choices = document.getElementById('choices');
  const stars = document.getElementById('stars');
  const state = { target: null, opts: [], busy: false, score: Baby.getLevel() };

  function ask() { say('これは だれの かげかな？'); }

  function newRound() {
    state.busy = false;
    box.classList.remove('reveal');
    const all = Baby.fresh('shadow', () => shuffle(allItems()), a => a[0].item.id);
    state.target = all[0];
    // 同じセットから2つ、まぎらわしい選択肢にする
    const same = all.filter(p => p.set === state.target.set && p !== state.target).slice(0, 2);
    state.opts = shuffle([state.target, ...same]);
    box.innerHTML = '';
    box.appendChild(makeFace(state.target.set, state.target.item));
    Baby.prime([`${state.target.item.name}の かげでした！`, ...state.opts.map(p => `${p.item.name}じゃないよ。`), 'かげを よくみてね']);
    choices.innerHTML = '';
    for (const p of state.opts) {
      const c = document.createElement('div');
      c.className = 'choice'; c.dataset.id = p.item.id;
      c.appendChild(makeFace(p.set, p.item));
      choices.appendChild(c);
    }
    ask();
  }

  choices.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.choice');
    if (!c || state.busy) return;
    e.preventDefault();
    const p = state.opts.find(p => p.item.id === c.dataset.id);
    animate(c.querySelector('.face'), 'bounce', 600);
    burst(e.clientX, e.clientY, 5);
    if (p === state.target) {
      state.busy = true;
      box.classList.add('reveal');
      animate(c, 'glow', 900);
      SFX.correct();
      state.score++; Baby.setLevel(state.score);
      stars.textContent = '⭐'.repeat(((state.score - 1) % 5) + 1);
      Baby.sayThen([Baby.praise(), `${p.item.name}の かげでした！`], { delay: 300 }, () => {
        if (state.score % 5 === 0) Baby.reward().then(newRound);
        else newRound();
      }, 900);
    } else {
      animate(c, 'shake', 400);
      SFX.wrong();
      say([`${p.item.name}じゃないよ。`, 'かげを よくみてね'], { delay: 100 });
    }
  });

  document.getElementById('replay').addEventListener('pointerdown', (e) => { e.preventDefault(); if (!state.busy) ask(); });
  setupStart(() => setTimeout(newRound, 400));
  setupHome();
})();
</script>
</body>
</html>
