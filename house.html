<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>おうちをつくる</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e8f5e9">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="game.css">
<style>
  body { background: linear-gradient(180deg, #e8f5e9 0%, #ffffff 100%); }

  #scene { flex: 1.2; min-height: 0; position: relative; border-radius: 28px; background: linear-gradient(180deg, #b3e5fc 0%, #e1f5fe 62%, #a5d6a7 62%, #81c784 100%); overflow: hidden; }
  .part { position: absolute; display: flex; align-items: center; justify-content: center; }
  .part img { width: 100%; height: 100%; object-fit: contain; } .part.emoji { font-size: min(10vmin, 48px); }
  .part.pop { animation: pop .3s; } @keyframes pop { 0% { transform: scale(0.5); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  #wall { left: 30%; bottom: 14%; width: 40%; height: 34%; }
  #roof { left: 24%; bottom: 46%; width: 52%; height: 26%; }
  #door { left: 44%; bottom: 14%; width: 12%; height: 18%; }
  #winL { left: 32%; bottom: 30%; width: 10%; height: 12%; } #winR { left: 58%; bottom: 30%; width: 10%; height: 12%; }
  #chimney { left: 62%; bottom: 60%; width: 10%; height: 14%; }
  #tree { left: 4%; bottom: 12%; width: 22%; height: 40%; } #flower { left: 76%; bottom: 12%; width: 18%; height: 18%; }
  #sun { left: 4%; top: 4%; width: 18%; height: 18%; } #cloud { left: 70%; top: 6%; width: 22%; height: 14%; }
  #palette { height: min(30vh, 190px); overflow-y: auto; touch-action: pan-y; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .pal { aspect-ratio: 1; border-radius: 14px; background: var(--card); box-shadow: 0 4px 0 rgba(0,0,0,.08); display: flex; align-items: center; justify-content: center; }
  .pal.on { background: #fff6b3; box-shadow: 0 0 0 3px #ffd84d; }
  .pal .pic { width: 84%; height: 84%; display: flex; align-items: center; justify-content: center; } .pal .pic img { width: 100%; height: 100%; object-fit: contain; } .pal .pic.emoji { font-size: 28px; }
  #done { align-self: center; height: 46px; padding: 0 26px; border: none; border-radius: 24px; background: #ffd84d; font-size: 20px; font-weight: bold; color: #345; font-family: inherit; box-shadow: 0 5px 0 rgba(0,0,0,.12); }

</style>
</head>
<body>

<div id="start"><div class="big">🏠</div><div>タッチしてね</div></div>

<div id="stage">
  <div class="question" id="question">パーツを えらんで おうちを つくろう</div>
  <div class="stars" id="stars"></div>
  <div id="scene"></div>
  <div id="palette"></div>
  <button id="done" type="button">できた！</button>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>

<script src="common.js"></script>
<script src="catalog.js"></script>
<script>
(() => {
  'use strict';

  const { SFX, say, burst, animate, cheer, celebrate, setupStart, setupHome } = Baby;
  // [パーツの種類（置き場所）, 絵の名前, 絵文字, セリフ]
  const PARTS = [
    ['wall', 'wall', '🟫', 'かべ'], ['roof', 'roof-red', '🔺', 'あかい やね'], ['roof', 'roof-blue', '🔷', 'あおい やね'], ['roof', 'roof-green', '🟩', 'みどりの やね'],
    ['door', 'door-brown', '🚪', 'ちゃいろの ドア'], ['door', 'door-red', '🟥', 'あかい ドア'], ['win', 'window-square', '🪟', 'しかくい まど'], ['win', 'window-round', '⚪', 'まるい まど'],
    ['chimney', 'chimney', '🧱', 'えんとつ'], ['tree', 'tree', '🌳', 'き'], ['flower', 'flower', '🌷', 'おはな'], ['sun', 'sun', '☀️', 'おひさま'], ['cloud', 'cloud', '☁️', 'くも'],
  ];
  const scene = document.getElementById('scene'), palette = document.getElementById('palette');
  const stars = document.getElementById('stars');
  const state = { busy: false, chosen: {}, score: Baby.getLevel() };

  function win(after) {
    state.score++; Baby.setLevel(state.score);
    stars.textContent = '⭐'.repeat(((state.score - 1) % 5) + 1);
    return (state.score % 5 === 0 ? Baby.reward() : Promise.resolve()).then(after);
  }
  PARTS.forEach((p, i) => { const d = document.createElement('div'); d.className = 'pal'; d.dataset.i = i; d.appendChild(Baby.pic(`assets/house/${p[1]}.png`, p[2])); palette.appendChild(d); });
  function place(kind, name, emoji) {
    const ids = kind === 'win' ? ['winL', 'winR'] : [kind];
    for (const id of ids) {
      let el = document.getElementById(id);
      if (!el) { el = document.createElement('div'); el.id = id; el.className = 'part'; scene.appendChild(el); }
      el.innerHTML = ''; el.classList.remove('emoji');
      const im = new Image(); im.src = `assets/house/${name}.png`; im.alt = ''; im.onerror = () => { el.textContent = emoji; el.classList.add('emoji'); };
      el.appendChild(im); animate(el, 'pop', 300);
    }
    state.chosen[kind] = name;
    palette.querySelectorAll('.pal').forEach(x => { const p = PARTS[Number(x.dataset.i)]; if (p[0] === kind) x.classList.toggle('on', p[1] === name); });
  }
  function reset() {
    state.busy = false; state.chosen = {};
    scene.innerHTML = ''; palette.querySelectorAll('.pal').forEach(x => x.classList.remove('on'));
    place('wall', 'wall', '🟫');
    say('パーツを えらんで おうちを つくろう');
  }
  palette.addEventListener('pointerdown', (e) => {
    const d = e.target.closest('.pal'); if (!d || state.busy) return; e.preventDefault();
    const p = PARTS[Number(d.dataset.i)];
    place(p[0], p[1], p[2]); SFX.pop(); burst(e.clientX, e.clientY, 4); say(p[3]);
  });
  document.getElementById('done').addEventListener('pointerdown', (e) => {
    e.preventDefault(); if (state.busy) return;
    if (!state.chosen.roof || !state.chosen.door) { SFX.wrong(); say('やねと ドアを つけてね'); return; }
    state.busy = true; SFX.fanfare(); cheer('🏠'); celebrate();
    Baby.say('すてきな おうち！ できた！', { delay: 300 }).then(() => win(reset));
  });
  setupStart(() => setTimeout(reset, 300));
  setupHome();

})();
</script>
</body>
</html>
