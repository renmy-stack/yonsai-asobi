<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>どこかな？</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#bde6ff">
<link rel="stylesheet" href="common.css?v=202609231405">
<link rel="stylesheet" href="game.css?v=202609231405">
<style>
  body { background: linear-gradient(180deg, #bde6ff 0%, #d9f3ff 100%); }
</style>
</head>
<body>

<div id="start"><div class="big">🔍</div><div>タッチしてね</div></div>

<div id="stage">
  <div class="question" id="question"></div>
  <div class="stars" id="stars"></div>
  <div class="choices six" id="choices"></div>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>
<button id="replay" class="topbtn right" type="button">🔊</button>

<script src="common.js?v=202609231405"></script>
<script src="catalog.js?v=202609231405"></script>
<script>
(() => {
  'use strict';
  const { SFX, say, burst, animate, cheer, celebrate, setupStart, setupHome, shuffle, pick } = Baby;
  const question = document.getElementById('question');
  const stars = document.getElementById('stars');
  const choices = document.getElementById('choices');
  const SETS = Object.values(CATALOG);
  const state = { set: null, target: null, busy: false, score: Baby.getLevel(), round: 0 };

  function ask() { say(`${state.target.item.name}は どこかな？`); }

  function newBoard() {
    // 3問ごとにセットを変える。5問目以降は全部まぜる
    state.round++;
    const mixed = Baby.level() >= 3;   // レベル3から どうぶつ・のりもの・たべものを まぜる
    const size = [0, 4, 6, 6, 6, 8][Baby.level()];
    const pool = mixed ? shuffle(allItems()).slice(0, size) : shuffle(pick(SETS).items.map(item => ({ set: null, item }))).slice(0, size);
    choices.className = 'choices ' + ({ 4: 'four', 6: 'six', 8: 'eight' }[size]);
    if (!mixed) { const set = SETS.find(s => s.items.includes(pool[0].item)); pool.forEach(p => p.set = set); }
    choices.innerHTML = '';
    for (const p of pool) {
      const c = document.createElement('div');
      c.className = 'choice'; c.dataset.id = p.item.id;
      c.appendChild(makeFace(p.set, p.item));
      choices.appendChild(c);
    }
    state.pool = pool;
    Baby.prime(pool.map(p => [`それは ${p.item.name}。`, `${p.item.name}は どこかな？`]).flat());
    nextQuestion();
  }

  function nextQuestion() {
    state.busy = false;
    state.target = pick(state.pool.filter(p => p !== state.target));
    question.textContent = `${state.target.item.name}は どこ？`;
    ask();
  }

  choices.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.choice');
    if (!c || state.busy) return;
    e.preventDefault();
    const p = state.pool.find(p => p.item.id === c.dataset.id);
    animate(c.querySelector('.face'), 'bounce', 600);
    burst(e.clientX, e.clientY, 5);
    // タッチしたものの音（鳴き声・クラクションなど）は正解でも不正解でも鳴らす
    if (p.item.sfx && SFX[p.item.sfx]) SFX[p.item.sfx](); else SFX.pop();
    if (p === state.target) {
      state.busy = true;
      animate(c, 'glow', 900);
      setTimeout(() => SFX.correct(), 350);
      state.score++; Baby.setLevel(state.score);
      stars.textContent = '⭐'.repeat(((state.score - 1) % 5) + 1);
      if (state.score % 5 === 0) {
        setTimeout(() => { Baby.say('ごもん せいかい！ すごい！', { delay: 100 }).then(() => Baby.reward()).then(newBoard); }, 400);
      } else {
        Baby.sayThen(Baby.praise(), { delay: 300 }, nextQuestion, 500);
      }
    } else {
      SFX.wrong();
      say([`それは ${p.item.name}。`, `${state.target.item.name}は どこかな？`], { delay: 300 });
    }
  });

  document.getElementById('replay').addEventListener('pointerdown', (e) => { e.preventDefault(); if (state.target) ask(); });
  setupStart(() => setTimeout(newBoard, 400));
  setupHome();
})();
</script>
</body>
</html>
