<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>なんばんめ？</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e8f5e9">
<link rel="stylesheet" href="common.css?v=202609261649">
<link rel="stylesheet" href="game.css?v=202609261649">
<style>
  body { background: linear-gradient(180deg, #e8f5e9 0%, #ffffff 100%); }

  #row { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 2%; padding: 8px; border-radius: 28px; background: var(--card); box-shadow: 0 6px 0 rgba(0,0,0,.08); position: relative; }
  #row .it { width: 15%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 16px; }
  #row .it img { width: 100%; height: 100%; object-fit: contain; }
  #row .it.ok { background: #fff6b3; }
  #mark { position: absolute; top: 8px; font-size: 18px; font-weight: bold; color: #e65100; background: #fff3e0; padding: 2px 10px; border-radius: 12px; }
  #mark.front { left: 12px; } #mark.back { right: 12px; }
  #big { text-align: center; font-size: min(9vw, 40px); font-weight: bold; color: #345; min-height: 50px; }

</style>
</head>
<body>

<div id="start"><div class="big">🔢</div><div>タッチしてね</div></div>

<div id="stage">
  <div class="question" id="question">なんばんめ かな？</div>
  <div class="stars" id="stars"></div>
  <div id="big"></div>
  <div id="row"><div id="mark" class="front">まえ</div></div>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>
<button id="replay" class="topbtn right" type="button">🔊</button>
<script src="common.js?v=202609261649"></script>
<script src="catalog.js?v=202609261649"></script>
<script>
(() => {
  'use strict';

  const { SFX, say, sayThen, burst, animate, setupStart, setupHome, shuffle, pick } = Baby;
  const NTH = ['', 'いちばんめ', 'にばんめ', 'さんばんめ', 'よんばんめ', 'ごばんめ', 'ろくばんめ'];
  const row = document.getElementById('row'), mark = document.getElementById('mark'), big = document.getElementById('big');
  const stars = document.getElementById('stars');
  const state = { items: [], k: 0, front: true, busy: false, score: Baby.getLevel() };

  function win(after) {
    state.score++; Baby.setLevel(state.score);
    stars.textContent = '⭐'.repeat(((state.score - 1) % 5) + 1);
    return (state.score % 5 === 0 ? Baby.reward() : Promise.resolve()).then(after);
  }
  function ask() { say([state.front ? 'まえから' : 'うしろから', `${NTH[state.k]}は どれ？`]); }
  function newRound() {
    state.busy = false;
    const n = [0, 4, 4, 5, 6, 6][Baby.level()];
    state.front = Baby.level() <= 2 ? true : Baby.level() === 3 ? false : Math.random() < 0.5;   // 1-2: まえから, 3: うしろから, 4-: まぜる
    const set = pick(Object.values(CATALOG));
    state.items = shuffle(set.items).slice(0, n).map(item => ({ set, item }));
    state.k = Baby.fresh('nth', () => 1 + Math.floor(Math.random() * n), String);
    row.querySelectorAll('.it').forEach(x => x.remove());
    state.items.forEach((p, i) => {
      const d = document.createElement('div'); d.className = 'it'; d.dataset.i = i;
      d.appendChild(makeFace(p.set, p.item)); row.appendChild(d);
    });
    mark.className = state.front ? 'front' : 'back'; mark.textContent = state.front ? 'まえ ➡' : '⬅ うしろ';
    big.textContent = `${state.front ? 'まえ' : 'うしろ'}から ${state.k}ばんめ`;
    Baby.prime(['ちがうよ。', 'まえから', 'うしろから']);
    ask();
  }
  row.addEventListener('pointerdown', (e) => {
    const d = e.target.closest('.it'); if (!d || state.busy) return; e.preventDefault();
    const i = Number(d.dataset.i);
    const pos = state.front ? i + 1 : state.items.length - i;
    burst(e.clientX, e.clientY, 5);
    if (pos === state.k) {
      state.busy = true; d.classList.add('ok'); animate(d, 'glow', 900); SFX.correct();
      sayThen([Baby.praise(), state.front ? 'まえから' : 'うしろから', `${NTH[state.k]}！`], { delay: 300 }, () => win(newRound), 600);
    } else {
      animate(d, 'shake', 400); SFX.wrong();
      say(['ちがうよ。', state.front ? 'まえから' : 'うしろから', `${NTH[state.k]}は どれ？`], { delay: 200 });
    }
  });
  document.getElementById('replay').addEventListener('pointerdown', (e) => { e.preventDefault(); if (!state.busy) ask(); });
  setupStart(() => setTimeout(newRound, 400));
  setupHome();

})();
</script>
</body>
</html>
