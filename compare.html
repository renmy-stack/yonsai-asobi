<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>くらべよう</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff8e1">
<link rel="stylesheet" href="common.css?v=202609222111">
<link rel="stylesheet" href="game.css?v=202609222111">
<style>
  body { background: linear-gradient(180deg, #fff8e1 0%, #fffdf5 100%); }
  .choices.two { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  @media (orientation: landscape) { .choices.two { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; } }
  .choice { padding: 8px; }
  .choice .face { width: var(--sz, 84%); height: var(--sz, 84%); }
  .group { display: flex; flex-wrap: wrap; align-content: center; align-items: center; justify-content: center; gap: 4px; width: 100%; height: 100%; }
  .group .face { width: 30%; height: 45%; }
  .group .face img { width: 100%; height: 100%; object-fit: contain; }
  .group .face.emoji { display: flex; align-items: center; justify-content: center; font-size: min(10vmin, 48px); }
</style>
</head>
<body>

<div id="start"><div class="big">⚖️</div><div>タッチしてね</div></div>

<div id="stage">
  <div class="question" id="question"></div>
  <div class="stars" id="stars"></div>
  <div class="choices two" id="choices"></div>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>
<button id="replay" class="topbtn right" type="button">🔊</button>

<script src="common.js?v=202609222111"></script>
<script src="catalog.js?v=202609222111"></script>
<script>
(() => {
  'use strict';
  const { SFX, say, sayThen, burst, animate, cheer, celebrate, setupStart, setupHome, shuffle, pick } = Baby;
  const choices = document.getElementById('choices');
  const stars = document.getElementById('stars');
  const question = document.getElementById('question');
  const KINDS = [
    { key: 'big',   q: 'おおきいのは どっち？', pickAns: (a, b) => a.size > b.size },
    { key: 'small', q: 'ちいさいのは どっち？', pickAns: (a, b) => a.size < b.size },
    { key: 'many',  q: 'おおいのは どっち？',   pickAns: (a, b) => a.count > b.count },
    { key: 'few',   q: 'すくないのは どっち？', pickAns: (a, b) => a.count < b.count },
  ];
  const state = { kind: null, sides: [], answer: 0, busy: false, score: Baby.getLevel() };

  function ask() { say(state.kind.q); }

  function newRound() {
    state.busy = false;
    const { kind, p } = Baby.fresh('compare', () => ({ kind: pick(KINDS), p: pick(allItems()) }), v => v.kind.key + v.p.item.id);
    state.kind = kind;
    state.item = p.item;
    choices.innerHTML = '';
    if (state.kind.key === 'big' || state.kind.key === 'small') {
      const sizes = shuffle([90, [0, 40, 50, 60, 68, 75][Baby.level()]]);   // だんだん差が小さく
      state.sides = sizes.map(size => ({ size }));
      sizes.forEach(size => {
        const c = document.createElement('div');
        c.className = 'choice';
        c.style.setProperty('--sz', `${size}%`);
        c.appendChild(makeFace(p.set, p.item));
        choices.appendChild(c);
      });
    } else {
      const mx = Baby.level() >= 4 ? 6 : 5, md = Baby.level() <= 2 ? 2 : 1;   // 最初は数の差2以上、レベル3から差1も
      let a, b;
      do { a = 1 + Math.floor(Math.random() * mx); b = 1 + Math.floor(Math.random() * mx); } while (Math.abs(a - b) < md);
      state.sides = [{ count: a }, { count: b }];
      [a, b].forEach(n => {
        const c = document.createElement('div');
        c.className = 'choice';
        const g = document.createElement('div'); g.className = 'group';
        for (let i = 0; i < n; i++) g.appendChild(makeFace(p.set, p.item));
        c.appendChild(g);
        choices.appendChild(c);
      });
    }
    state.answer = state.kind.pickAns(state.sides[0], state.sides[1]) ? 0 : 1;
    question.textContent = state.kind.q;
    Baby.prime(['こっちが', 'おおきい！', 'ちいさい！', ...state.sides.map(s => s.count != null ? `${countWord(state.item, s.count)}！` : null).filter(Boolean)]);
    ask();
  }

  choices.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.choice');
    if (!c || state.busy) return;
    e.preventDefault();
    const i = [...choices.children].indexOf(c);
    burst(e.clientX, e.clientY, 5);
    if (i === state.answer) {
      state.busy = true;
      animate(c, 'glow', 900);
      SFX.correct();
      state.score++; Baby.setLevel(state.score);
      stars.textContent = '⭐'.repeat(((state.score - 1) % 5) + 1);
      const s = state.sides[i];
      // 助数詞はものに合わせる（いぬ→さんびき、くるま→さんだい、りんご→さんこ）
      const word = s.count != null ? countWord(state.item, s.count) : (state.kind.key === 'big' ? 'おおきい' : 'ちいさい');
      const done = () => {
        if (state.score % 5 === 0) Baby.reward().then(newRound);
        else newRound();
      };
      sayThen([Baby.praise(), 'こっちが', `${word}！`], { delay: 300 }, done, 700);
    } else {
      animate(c, 'shake', 400);
      SFX.wrong();
      say(['ちがうよ。', state.kind.q], { delay: 100 });
    }
  });

  document.getElementById('replay').addEventListener('pointerdown', (e) => { e.preventDefault(); if (!state.busy) ask(); });
  setupStart(() => setTimeout(newRound, 400));
  setupHome();
})();
</script>
</body>
</html>
