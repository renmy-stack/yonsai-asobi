<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>かげのむき</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ede7f6">
<link rel="stylesheet" href="common.css?v=202609261644">
<link rel="stylesheet" href="game.css?v=202609261644">
<style>
  body { background: linear-gradient(180deg, #ede7f6 0%, #ffffff 100%); }

  #sample { flex: 0.9; min-height: 0; display: flex; align-items: center; justify-content: center; border-radius: 28px; background: var(--card); box-shadow: 0 6px 0 rgba(0,0,0,.08); }
  #sample .face { width: 60%; height: 80%; } #sample .face img { width: 100%; height: 100%; object-fit: contain; transform: rotate(var(--r)); }
  .choices.four { grid-template-columns: repeat(2, 1fr); }
  .choice .face img { transform: rotate(var(--r)); filter: brightness(0) opacity(.75); }

</style>
</head>
<body>

<div id="start"><div class="big">🔄</div><div>タッチしてね</div></div>

<div id="stage">
  <div class="question" id="question">おなじ むきの かげは どれ？</div>
  <div class="stars" id="stars"></div>
  <div id="sample"></div>
  <div class="choices" id="choices"></div>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>
<button id="replay" class="topbtn right" type="button">🔊</button>
<script src="common.js?v=202609261644"></script>
<script src="catalog.js?v=202609261644"></script>
<script>
(() => {
  'use strict';

  const { SFX, say, sayThen, burst, animate, setupStart, setupHome, shuffle, pick } = Baby;
  const sample = document.getElementById('sample'), choices = document.getElementById('choices');
  const stars = document.getElementById('stars');
  const state = { p: null, a: 0, opts: [], busy: false, score: Baby.getLevel() };

  function win(after) {
    state.score++; Baby.setLevel(state.score);
    stars.textContent = '⭐'.repeat(((state.score - 1) % 5) + 1);
    return (state.score % 5 === 0 ? Baby.reward() : Promise.resolve()).then(after);
  }
  function ask() { say('おなじ むきの かげは どれ？'); }
  function newRound() {
    state.busy = false;
    const n = [0, 2, 3, 4, 4, 4][Baby.level()];
    state.p = Baby.fresh('rotate', () => pick(allItems()), v => v.item.id);
    const angles = shuffle([0, 90, 180, 270]).slice(0, n);
    state.a = angles[0]; state.opts = shuffle(angles);
    sample.innerHTML = ''; const f = makeFace(state.p.set, state.p.item); f.style.setProperty('--r', `${state.a}deg`); sample.appendChild(f);
    choices.className = 'choices ' + ({ 2: 'two', 3: '', 4: 'four' }[n]);
    choices.innerHTML = '';
    state.opts.forEach((a, i) => {
      const d = document.createElement('div'); d.className = 'choice'; d.dataset.i = i;
      const g = makeFace(state.p.set, state.p.item); g.style.setProperty('--r', `${a}deg`); d.appendChild(g); choices.appendChild(d);
    });
    Baby.prime(['むきが ちがうよ', 'おなじ むき！']);
    ask();
  }
  choices.addEventListener('pointerdown', (e) => {
    const d = e.target.closest('.choice'); if (!d || state.busy) return; e.preventDefault();
    burst(e.clientX, e.clientY, 5);
    if (state.opts[Number(d.dataset.i)] === state.a) {
      state.busy = true; animate(d, 'glow', 900); SFX.correct();
      const im = d.querySelector('img'); if (im) im.style.filter = 'none';
      sayThen([Baby.praise(), 'おなじ むき！'], { delay: 300 }, () => win(newRound), 600);
    } else {
      animate(d, 'shake', 400); SFX.wrong();
      say(['むきが ちがうよ', 'おなじ むきの かげは どれ？'], { delay: 200 });
    }
  });
  document.getElementById('replay').addEventListener('pointerdown', (e) => { e.preventDefault(); if (!state.busy) ask(); });
  setupStart(() => setTimeout(newRound, 400));
  setupHome();

})();
</script>
</body>
</html>
