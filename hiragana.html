<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ひらがな</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffe0ec">
<link rel="stylesheet" href="common.css?v=202609261636">
<link rel="stylesheet" href="game.css?v=202609261636">
<style>
  body { background: linear-gradient(180deg, #ffe0ec 0%, #fff0f5 100%); }
  .bigchar { flex: 1; min-height: 0; color: #c2185b; }
  .choices { flex: 1.1; }
  .choice .label { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 16px; font-weight: bold; color: #789; }
  .choice .label b { color: #c2185b; font-size: 20px; }
  .choice .label { opacity: 0; transition: opacity .3s; }
  .choices.reveal .choice .label { opacity: 1; }
  .choice .face { height: 70%; margin-bottom: 14%; }
</style>
</head>
<body>

<div id="start"><div class="big">あ</div><div>タッチしてね</div></div>

<div id="stage">
  <div class="question" id="question"></div>
  <div class="stars" id="stars"></div>
  <div class="bigchar" id="kana"></div>
  <div class="choices" id="choices"></div>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>
<button id="replay" class="topbtn right" type="button">🔊</button>

<script src="common.js?v=202609261636"></script>
<script src="catalog.js?v=202609261636"></script>
<script>
(() => {
  'use strict';
  const { SFX, say, burst, animate, cheer, celebrate, setupStart, setupHome, shuffle, pick } = Baby;
  const isHira = (ch) => ch >= 'ぁ' && ch <= 'ゖ';
  // ひらがなで始まる名前だけ使う
  const POOL = allItems().filter(p => isHira(p.item.name[0]));
  const kana = document.getElementById('kana');
  const choices = document.getElementById('choices');
  const stars = document.getElementById('stars');
  const question = document.getElementById('question');
  const state = { target: null, opts: [], busy: false, score: Baby.getLevel(), showLabel: false };

  function ask() { say(`${state.target.item.name[0]}で はじまるのは どれかな？`); }

  function newRound() {
    state.busy = false;
    const shuffled = Baby.fresh('hiragana', () => shuffle(POOL), a => a[0].item.id);
    state.target = shuffled[0];
    const first = state.target.item.name[0];
    const others = [];
    for (const p of shuffled.slice(1)) {
      if (p.item.name[0] !== first && !others.some(o => o.item.name[0] === p.item.name[0])) others.push(p);
      if (others.length === [0, 2, 2, 3, 3, 5][Baby.level()]) break;
    }
    state.opts = shuffle([state.target, ...others]);
    kana.textContent = first;
    question.textContent = `「${first}」で はじまるのは どれ？`;
    Baby.prime([`${first}、${state.target.item.name}！`, ...state.opts.map(p => [`${p.item.name}は`, `${p.item.name[0]}で はじまるね。`]).flat(), `${first}は どれかな？`]);
    choices.className = 'choices' + ({ 3: '', 4: ' four', 6: ' six' }[state.opts.length] || '');
    choices.innerHTML = '';
    for (const p of state.opts) {
      const c = document.createElement('div');
      c.className = 'choice'; c.dataset.id = p.item.id;
      c.appendChild(makeFace(p.set, p.item));
      const label = document.createElement('div');
      label.className = 'label';
      label.innerHTML = `<b>${p.item.name[0]}</b>${p.item.name.slice(1)}`;
      c.appendChild(label);
      choices.appendChild(c);
    }
    ask();
  }

  choices.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.choice');
    if (!c || state.busy) return;
    e.preventDefault();
    const p = state.opts.find(p => p.item.id === c.dataset.id);
    animate(c.querySelector('.face'), 'bounce', 600);
    burst(e.clientX, e.clientY, 5);
    if (p === state.target) {
      state.busy = true;
      choices.classList.add('reveal');          // 答えたあとに文字を見せる
      animate(c, 'glow', 900);
      SFX.correct();
      state.score++; Baby.setLevel(state.score);
      stars.textContent = '⭐'.repeat(((state.score - 1) % 5) + 1);
      Baby.sayThen([Baby.praise(), `${p.item.name[0]}、${p.item.name}！`], { delay: 300 }, () => {
        if (state.score % 5 === 0) Baby.reward().then(newRound);
        else newRound();
      }, 700);
    } else {
      animate(c, 'shake', 400);
      SFX.wrong();
      say([`${p.item.name}は`, `${p.item.name[0]}で はじまるね。`, `${state.target.item.name[0]}は どれかな？`], { delay: 100 });
    }
  });

  document.getElementById('replay').addEventListener('pointerdown', (e) => { e.preventDefault(); if (!state.busy) ask(); });
  setupStart(() => setTimeout(newRound, 400));
  setupHome();
})();
</script>
</body>
</html>
