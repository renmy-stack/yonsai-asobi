<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ボールころがし</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e8f5e9">
<link rel="stylesheet" href="common.css?v=202609261736">
<link rel="stylesheet" href="game.css?v=202609261736">
<style>
  body { background: linear-gradient(180deg, #e8f5e9 0%, #ffffff 100%); }

  #field { flex: 1; min-height: 0; position: relative; border-radius: 28px; background: linear-gradient(180deg, #e1f5fe 0%, #fffde7 100%); overflow: hidden; touch-action: none; box-shadow: 0 6px 0 rgba(0,0,0,.08); }
  #field canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  /* 下の棚: もどす・けす・ころがす */
  #tray { flex-shrink: 0; height: 76px; display: flex; gap: 10px; justify-content: center; align-items: stretch; }
  #tray button { border: none; border-radius: 20px; background: var(--card); box-shadow: 0 6px 0 rgba(0,0,0,.08); touch-action: none; font-family: inherit; font-size: 30px; flex: 1; max-width: 90px; min-width: 0; }
  #tray button:disabled { opacity: .45; }
  #go { flex: 2 !important; max-width: 200px !important; background: #ffd84d !important; font-size: min(22px, 5.5vw) !important; font-weight: bold; color: #345; white-space: nowrap; box-shadow: 0 6px 0 rgba(0,0,0,.12) !important; }
</style>
<script src="/t.js?v=1"></script>
</head>
<body>

<div id="start"><div class="big">⚽</div><div>タッチしてね</div></div>

<div id="stage">
  <div class="question" id="question">せんを かいて カゴまで</div>
  <div class="stars" id="stars"></div>
  <div id="field"><canvas id="cv"></canvas></div>
  <div id="tray">
    <button id="undo" type="button" aria-label="もどす">↩️</button>
    <button id="clear" type="button" aria-label="ぜんぶけす">🗑️</button>
    <button id="go" type="button">ころがす！</button>
  </div>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>

<script src="common.js?v=202609261736"></script>
<script>
(() => {
  'use strict';

  const { SFX, say, burst, cheer, celebrate, setupStart, setupHome, tone } = Baby;
  const field = document.getElementById('field'), cv = document.getElementById('cv'), g = cv.getContext('2d');
  const stars = document.getElementById('stars'), go = document.getElementById('go'), undoBtn = document.getElementById('undo'), clearBtn = document.getElementById('clear');

  // ---------- 世界（幅 600。高さは画面の形に合わせる） ----------
  const WW = 600;
  const R = 22;              // ボールの半径
  const HT = 8;              // 線の半分の太さ
  const G = 1100, E = 0.25;  // 重力・はねかえり
  const MAX_LINES = 20;      // 線の本数の上限（古いものから消える）
  const IMG = {};
  for (const [k, src] of Object.entries({ ball: 'assets/blocks/ball.png', plank: 'assets/blocks/plank.png', basket: 'assets/misc/basket.png', rock: 'assets/misc/rock.png' })) {
    const im = new Image(); im.src = src; im.onload = () => { im.crop = alphaBox(im); IMG[k] = im; }; im.onerror = () => {};
  }
  // 絵の中で色のついている範囲（透明な余白を除いて、ボールや棚の大きさにぴったり合わせる）
  function alphaBox(img) {
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const cg = c.getContext('2d'); cg.drawImage(img, 0, 0);
    const d = cg.getImageData(0, 0, c.width, c.height).data;
    let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
      if (d[(y * c.width + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    return x1 < x0 ? { x: 0, y: 0, w: c.width, h: c.height } : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  }
  // 絵を 余白を除いて (x, y) 中心・幅 w に描く（高さは絵の形のまま。h を渡せばその高さ）
  function di(ctx, im, x, y, w, h) { const c = im.crop; if (!h) h = w * c.h / c.w; ctx.drawImage(im, c.x, c.y, c.w, c.h, x - w / 2, y - h / 2, w, h); }

  const state = { lines: [], cur: null, ball: null, rolling: false, busy: false, score: Baby.getLevel(), stage: null, WH: 800, last: 0, acc: 0, stuckT: 0, pid: null };

  function win(after) {
    state.score++; Baby.setLevel(state.score);
    stars.textContent = '⭐'.repeat(((state.score - 1) % 5) + 1);
    return (state.score % 5 === 0 ? Baby.reward() : Promise.resolve()).then(after);
  }

  // ---------- 画面と世界の対応 ----------
  let W = 0, H = 0, scale = 1;
  function fit() {
    const r = field.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = W / WW; state.WH = H / scale;
  }
  new ResizeObserver(fit).observe(field); fit();
  const toWorld = (cx, cy) => { const r = field.getBoundingClientRect(); return { x: (cx - r.left) / scale, y: (cy - r.top) / scale }; };

  // ---------- ステージ ----------
  // ledge: ボールが乗っている棚（左上か右上）。basket: カゴの中心 x と口の y。rocks: じゃまな岩
  function makeStage() {
    const lv = Math.min(5, Baby.level()), WH = state.WH;
    const left = lv <= 2 ? true : Math.random() < 0.5;
    const ledgeX = left ? 70 : WW - 70, ledgeY = 90;
    let bx;
    if (lv === 1) bx = left ? 260 + Math.random() * 120 : WW - 260 - Math.random() * 120;   // 近い
    else if (lv === 2) bx = left ? 420 + Math.random() * 120 : WW - 420 - Math.random() * 120;  // 遠い
    else bx = 90 + Math.random() * (WW - 180);
    const by = WH - 40;
    const rocks = [];
    if (lv >= 4) rocks.push({ x: (ledgeX + bx) / 2 + (Math.random() - 0.5) * 80, y: (ledgeY + by) / 2 + (Math.random() - 0.5) * 60, r: 42 });
    if (lv >= 5) rocks.push({ x: 90 + Math.random() * (WW - 180), y: ledgeY + 120 + Math.random() * (by - ledgeY - 260), r: 34 });
    return { ledgeX, ledgeY, left, bx, by, rocks };
  }
  function resetBall() {
    const s = state.stage;
    state.ball = { x: s.ledgeX - (s.left ? 30 : -30), y: s.ledgeY - HT - R - 8, vx: 0, vy: 0, rot: 0 };
    state.rolling = false; state.stuckT = 0; state.lastN = null;
    go.disabled = false;
  }
  function newRound() {
    state.busy = false; state.lines = []; state.cur = null;
    state.stage = makeStage(); resetBall();
    Baby.prime(['ころがす！', 'カゴに はいった！ やったね！', 'おっこちた。 せんを かきなおして もういちど']);
    say('せんを かいて ボールを カゴまで ころがそう');
  }

  // ---------- 線（描いた線は 固い木の線。点を減らして当たりを軽くする） ----------
  function simplify(pts, tol) {
    if (pts.length < 3) return pts.slice();
    const keep = new Array(pts.length).fill(false); keep[0] = keep[pts.length - 1] = true;
    const stack = [[0, pts.length - 1]];
    while (stack.length) {
      const [i0, i1] = stack.pop(), a = pts[i0], b = pts[i1], dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
      let best = -1, bd = tol;
      for (let i = i0 + 1; i < i1; i++) {
        const p = pts[i]; let d;
        if (l2 === 0) d = Math.hypot(p.x - a.x, p.y - a.y);
        else { let u = ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2; u = Math.max(0, Math.min(1, u)); d = Math.hypot(p.x - (a.x + dx * u), p.y - (a.y + dy * u)); }
        if (d > bd) { bd = d; best = i; }
      }
      if (best >= 0) { keep[best] = true; stack.push([i0, best], [best, i1]); }
    }
    return pts.filter((p, i) => keep[i]);
  }
  const lineLength = (pts) => { let l = 0; for (let i = 1; i < pts.length; i++) l += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); return l; };

  // ---------- 物理（ボール = 円、線 = 太い線分、岩 = 円） ----------
  // 当たりは 全部集めてから まとめて解く。線分ごとに順番に押し出すと、折れ目や 重なった線で
  // 押し出し・はねかえり・摩擦が 何重にもかかって ボールが浮いたり ふわふわ落ちたりする（オーナー報告「重力がおかしい」）
  const contacts = [];
  function segContact(b, ax, ay, bx, by, rad) {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    let u = l2 ? ((b.x - ax) * dx + (b.y - ay) * dy) / l2 : 0; u = Math.max(0, Math.min(1, u));
    const qx = ax + dx * u, qy = ay + dy * u, ex = b.x - qx, ey = b.y - qy, d = Math.hypot(ex, ey), pen = rad - d;
    if (pen <= 0) return;
    contacts.push({ nx: d > 1e-6 ? ex / d : 0, ny: d > 1e-6 ? ey / d : -1, pen });
  }
  function circleContact(b, c) {
    const ex = b.x - c.x, ey = b.y - c.y, d = Math.hypot(ex, ey), pen = R + c.r - d;
    if (pen <= 0) return;
    contacts.push({ nx: ex / (d || 1), ny: ey / (d || 1), pen });
  }
  // 棚は 少しだけ 中央へ傾いている（ボールが自然に転がり出す）
  const LEDGE_A = 0.18, LEDGE_L = 120;
  function ledgeEnds(s) { const a = s.left ? LEDGE_A : -LEDGE_A, c = Math.cos(a) * LEDGE_L / 2, si = Math.sin(a) * LEDGE_L / 2; return [s.ledgeX - c, s.ledgeY - si, s.ledgeX + c, s.ledgeY + si]; }
  function gather(b, s) {
    contacts.length = 0;
    for (const ln of state.lines) for (let i = 1; i < ln.length; i++) segContact(b, ln[i - 1].x, ln[i - 1].y, ln[i].x, ln[i].y, R + HT);
    segContact(b, ...ledgeEnds(s), R + HT);
    for (const c of s.rocks) circleContact(b, c);
    for (const sx of [s.bx - 52, s.bx + 52]) segContact(b, sx, s.by, sx, s.by + 50, R + 4);   // カゴのふち（左右の壁）
  }
  function stepBall(dt) {
    const b = state.ball, s = state.stage;
    b.vy += G * dt;
    const sp = Math.hypot(b.vx, b.vy); if (sp > 1800) { b.vx *= 1800 / sp; b.vy *= 1800 / sp; }   // すり抜け防止
    b.x += b.vx * dt; b.y += b.vy * dt;
    // 位置: いちばん深い当たりから押し出す（押し出したら集め直す。最大 4 回）
    let touching = false, deep = null;
    for (let it = 0; it < 4; it++) {
      gather(b, s);
      if (!contacts.length) break;
      let c = contacts[0]; for (const k of contacts) if (k.pen > c.pen) c = k;
      b.x += c.nx * c.pen; b.y += c.ny * c.pen;
      if (!deep) deep = c;
      touching = true;
    }
    if (touching) {
      // 速さ: 触れている面それぞれで めり込む向きの速さだけ消す（はねかえりは 1 回）
      gather(b, s);
      const faces = contacts.length ? contacts : [deep];
      // 直前も触れていて 面の向きがあまり変わらないなら「ぶつかった」ではなく「面に沿って曲がった」:
      // 線に沿った速さを保つ（指で描いた線は細かい折れ線なので、折れ目ごとに減速すると ギュッと遅くなって見える）
      const last = state.lastN;
      const vtOld = last ? Math.abs(b.vx * -last.ny + b.vy * last.nx) : 0;
      let bounced = false, follow = false;
      for (const c of faces) {
        const vn = b.vx * c.nx + b.vy * c.ny;
        if (vn >= 0) continue;
        if (last && faces.length === 1 && c.nx * last.nx + c.ny * last.ny > 0.7) { b.vx -= vn * c.nx; b.vy -= vn * c.ny; follow = true; }
        else { const e = bounced ? 0 : E; b.vx -= (1 + e) * vn * c.nx; b.vy -= (1 + e) * vn * c.ny; if (!bounced && vn < -180) SFX.pop(); bounced = true; }
      }
      const c = deep, tx = -c.ny, ty = c.nx;
      if (follow && !bounced) {
        const vt = b.vx * tx + b.vy * ty;
        if (Math.abs(vt) > 1e-6 && Math.abs(vt) < vtOld) { const k = vtOld / Math.abs(vt); b.vx = tx * vt * k; b.vy = ty * vt * k; }
      }
      // ころがる: 触れている間は少しずつ遅くなる（1 回だけ）
      const vt = b.vx * tx + b.vy * ty, f = vt * 0.004;
      b.vx -= f * tx; b.vy -= f * ty;
      b.rot += vt / R * dt;
      state.lastN = { nx: c.nx, ny: c.ny };
    } else state.lastN = null;
    // 画面のはしに かべは無い（オーナー指摘）。横や下に出たら「おっこちた」。上に飛んでも重力で戻る
    if (!touching) b.rot += b.vx / R * dt;
    // カゴに入った？
    if (b.y > s.by + 6 && b.x > s.bx - 48 && b.x < s.bx + 48 && b.vy >= 0) return 'in';
    if (b.y > state.WH + R * 2 || b.x < -R * 2 || b.x > WW + R * 2) return 'out';
    // 止まっちゃった？
    if (Math.hypot(b.vx, b.vy) < 8) { state.stuckT += dt; if (state.stuckT > 1.6) return 'stuck'; } else state.stuckT = 0;
    return null;
  }

  // ---------- 描画 ----------
  function drawLine(pts, alpha) {
    if (pts.length < 2) return;
    g.save(); g.globalAlpha = alpha; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p.x * scale, p.y * scale) : g.moveTo(p.x * scale, p.y * scale));
    g.lineWidth = (HT * 2 + 4) * scale; g.strokeStyle = '#8d6e63'; g.stroke();
    g.lineWidth = HT * 2 * scale; g.strokeStyle = '#e6c08f'; g.stroke();
    g.restore();
  }
  function render() {
    const s = state.stage; if (!s) return;
    g.clearRect(0, 0, W, H);
    // 棚
    g.save(); g.translate(s.ledgeX * scale, s.ledgeY * scale); g.rotate(s.left ? LEDGE_A : -LEDGE_A); g.scale(scale, scale);
    if (IMG.plank) di(g, IMG.plank, 0, 0, LEDGE_L + 6, HT * 2 + 8);
    else { g.fillStyle = '#c69c6d'; g.fillRect(-LEDGE_L / 2, -HT, LEDGE_L, HT * 2); }
    g.restore();
    // 岩
    for (const c of s.rocks) {
      if (IMG.rock) di(g, IMG.rock, c.x * scale, c.y * scale, c.r * 2.2 * scale, c.r * 2.2 * scale);
      else { g.fillStyle = '#9e9e9e'; g.beginPath(); g.arc(c.x * scale, c.y * scale, c.r * scale, 0, Math.PI * 2); g.fill(); }
    }
    // 線
    for (const ln of state.lines) drawLine(ln, 1);
    if (state.cur) drawLine(state.cur, 0.7);
    // カゴ
    const bw = 120;
    if (IMG.basket) di(g, IMG.basket, s.bx * scale, (s.by + 4) * scale, bw * scale);
    else { g.fillStyle = '#d7a86e'; g.fillRect((s.bx - 56) * scale, s.by * scale, 112 * scale, 60 * scale); }
    // ボール
    const b = state.ball;
    g.save(); g.translate(b.x * scale, b.y * scale); g.rotate(b.rot);
    if (IMG.ball) di(g, IMG.ball, 0, 0, R * 2.1 * scale, R * 2.1 * scale);
    else { g.fillStyle = '#ef5350'; g.beginPath(); g.arc(0, 0, R * scale, 0, Math.PI * 2); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(R * 0.4 * scale, 0, R * 0.25 * scale, 0, Math.PI * 2); g.fill(); }
    g.restore();
  }

  // ---------- 進行 ----------
  function frame(t) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (t - state.last) / 1000 || 0); state.last = t;
    if (state.rolling && !state.busy) {
      state.acc += dt; let res = null;
      while (state.acc >= 1 / 120 && !res) { res = stepBall(1 / 120); state.acc -= 1 / 120; }
      if (res) finish(res);
    }
    render();
  }
  function finish(res) {
    state.rolling = false;
    if (res === 'in') {
      state.busy = true; SFX.correct(); cheer('🎉'); celebrate();
      say('カゴに はいった！ やったね！', { delay: 300 }).then(() => win(() => setTimeout(newRound, 400)));
    } else {
      SFX.wrong && SFX.wrong();
      say(res === 'out' ? 'おっこちた。 せんを かきなおして もういちど' : 'とまっちゃった。 せんを かきなおして もういちど').then(resetBall);
    }
  }
  requestAnimationFrame(frame);
  window._state = state;
  // テスト用: 拡張のテストでは rAF が止まるので、秒数ぶん物理だけ進める
  window.ff = (sec) => { let res = null; for (let i = 0; i < sec * 120 && state.rolling && !res; i++) res = stepBall(1 / 120); if (res) finish(res); render(); return res; };

  // ---------- 線を かく ----------
  field.addEventListener('pointerdown', (e) => {
    if (state.busy || state.rolling || state.cur || !state.stage) return;
    e.preventDefault();
    state.pid = e.pointerId; state.cur = [toWorld(e.clientX, e.clientY)];
  });
  document.addEventListener('pointermove', (e) => {
    if (!state.cur || e.pointerId !== state.pid) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const p = toWorld(ev.clientX, ev.clientY), q = state.cur[state.cur.length - 1];
      if (Math.hypot(p.x - q.x, p.y - q.y) >= 3) state.cur.push(p);
    }
  }, { passive: false });
  const endStroke = (e) => {
    if (!state.cur || e.pointerId !== state.pid) return;
    e.preventDefault();
    const pts = simplify(state.cur, 1.5); state.cur = null;
    if (lineLength(pts) < 12) return;
    state.lines.push(pts);
    if (state.lines.length > MAX_LINES) state.lines.shift();
    tone({ f0: 520, dur: 0.07, gain: 0.12 });
  };
  document.addEventListener('pointerup', endStroke);
  document.addEventListener('pointercancel', endStroke);
  undoBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); if (state.busy || state.rolling || !state.lines.length) return; state.lines.pop(); SFX.pop(); });
  clearBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); if (state.busy || state.rolling || !state.lines.length) return; state.lines = []; SFX.pop(); });
  go.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state.busy || state.rolling || state.cur || !state.stage) return;
    if (!state.lines.length) { say('せんを かいてね'); return; }
    go.disabled = true;
    say('ころがす！');
    const s = state.stage; state.ball.vx = s.left ? 60 : -60; state.rolling = true; state.acc = 0;
  });

  setupStart(() => setTimeout(newRound, 300));
  setupHome();
})();
</script>
</body>
</html>
