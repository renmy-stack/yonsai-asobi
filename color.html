<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>いろあて</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f4f4">
<link rel="stylesheet" href="common.css?v=202609261644">
<link rel="stylesheet" href="game.css?v=202609261644">
<style>
  body { background: linear-gradient(180deg, #f4f4f4 0%, #e9e9ef 100%); }
  #swatch {
    flex: 0.8; min-height: 0;
    border-radius: 28px;
    box-shadow: 0 6px 0 rgba(0,0,0,.1), inset 0 0 0 6px rgba(255,255,255,.6);
    display: flex; align-items: center; justify-content: center;
    font-size: min(12vw, 56px); font-weight: bold; color: rgba(0,0,0,.45);
    transition: background .3s;
  }
  .choices { flex: 1.3; }
  .choice { background: #fff; }
</style>
</head>
<body>

<div id="start"><div class="big">🎨</div><div>タッチしてね</div></div>

<div id="stage">
  <div class="question" id="question"></div>
  <div class="stars" id="stars"></div>
  <div id="swatch"></div>
  <div class="choices" id="choices"></div>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>
<button id="replay" class="topbtn right" type="button">🔊</button>

<script src="common.js?v=202609261644"></script>
<script src="catalog.js?v=202609261644"></script>
<script>
(() => {
  'use strict';
  const { SFX, say, burst, animate, cheer, celebrate, setupStart, setupHome, shuffle, pick } = Baby;
  const POOL = allItems().filter(p => p.item.color);
  const swatch = document.getElementById('swatch');
  const choices = document.getElementById('choices');
  const stars = document.getElementById('stars');
  const question = document.getElementById('question');
  const state = { color: null, target: null, opts: [], busy: false, score: Baby.getLevel() };

  function ask() { say(`${COLORS[state.color].name}のは どれかな？`); }

  function newRound() {
    state.busy = false;
    const shuffled = Baby.fresh('color', () => shuffle(POOL), a => a[0].item.color + a[0].item.id);
    state.target = shuffled[0];
    state.color = state.target.item.color;
    const others = [];
    for (const p of shuffled.slice(1)) {
      if (p.item.color !== state.color && !others.some(o => o.item.color === p.item.color)) others.push(p);
      if (others.length === [0, 2, 2, 3, 3, 5][Baby.level()]) break;
    }
    state.opts = shuffle([state.target, ...others]);
    const col = COLORS[state.color];
    swatch.style.background = col.css;
    swatch.textContent = col.name;
    question.textContent = `${col.name}のは どれ？`;
    Baby.prime([`${col.name}の`, `${state.target.item.name}！`, ...state.opts.map(p => [`${p.item.name}は`, `${COLORS[p.item.color].name}だね。`]).flat(), `${col.name}は どれかな？`]);
    choices.className = 'choices' + ({ 3: '', 4: ' four', 6: ' six' }[state.opts.length] || '');
    choices.innerHTML = '';
    for (const p of state.opts) {
      const c = document.createElement('div');
      c.className = 'choice'; c.dataset.id = p.item.id;
      c.appendChild(makeFace(p.set, p.item));
      choices.appendChild(c);
    }
    ask();
  }

  choices.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.choice');
    if (!c || state.busy) return;
    e.preventDefault();
    const p = state.opts.find(p => p.item.id === c.dataset.id);
    animate(c.querySelector('.face'), 'bounce', 600);
    burst(e.clientX, e.clientY, 5);
    if (p.item.color === state.color) {
      state.busy = true;
      animate(c, 'glow', 900);
      SFX.correct();
      state.score++; Baby.setLevel(state.score);
      stars.textContent = '⭐'.repeat(((state.score - 1) % 5) + 1);
      Baby.sayThen([Baby.praise(), `${COLORS[state.color].name}の`, `${p.item.name}！`], { delay: 300 }, () => {
        if (state.score % 5 === 0) Baby.reward().then(newRound);
        else newRound();
      }, 700);
    } else {
      animate(c, 'shake', 400);
      SFX.wrong();
      say([`${p.item.name}は`, `${COLORS[p.item.color].name}だね。`, `${COLORS[state.color].name}は どれかな？`], { delay: 100 });
    }
  });

  document.getElementById('replay').addEventListener('pointerdown', (e) => { e.preventDefault(); if (!state.busy) ask(); });
  setupStart(() => setTimeout(newRound, 400));
  setupHome();
})();
</script>
</body>
</html>
