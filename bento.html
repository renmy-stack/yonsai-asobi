<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>おべんとうづくり</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff3e0">
<link rel="stylesheet" href="common.css?v=202609221919">
<link rel="stylesheet" href="game.css?v=202609221919">
<style>
  body { background: linear-gradient(180deg, #fff3e0 0%, #ffffff 100%); }

  #box { flex: 1.1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  #boxpic { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #boxpic img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #boxpic.emoji { border-radius: 24px; background: #8d6e63; box-shadow: inset 0 0 0 10px #a1887f; }
  #slots { position: relative; width: min(92%, 70vh); aspect-ratio: 3 / 2; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 4%; padding: 7% 8%; box-sizing: border-box; }
  .slot { border-radius: 16px; display: flex; align-items: center; justify-content: center; }
  .slot:empty { background: rgba(255,255,255,.25); border: 3px dashed rgba(255,255,255,.7); }
  .slot .pic, .pal .pic { width: 90%; height: 90%; display: flex; align-items: center; justify-content: center; } .slot .pic img, .pal .pic img { width: 100%; height: 100%; object-fit: contain; }
  .pic.emoji { font-size: min(9vmin, 44px); }
  #palette { height: min(24vh, 150px); display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 6px; }
  .pal { border-radius: 16px; background: var(--card); box-shadow: 0 4px 0 rgba(0,0,0,.08); display: flex; align-items: center; justify-content: center; min-height: 0; }
  #done { align-self: center; height: 48px; padding: 0 26px; border: none; border-radius: 24px; background: #ffd84d; font-size: 20px; font-weight: bold; color: #345; font-family: inherit; box-shadow: 0 5px 0 rgba(0,0,0,.12); }

</style>
</head>
<body>

<div id="start"><div class="big">🍱</div><div>タッチしてね</div></div>

<div id="stage">
  <div class="question" id="question">すきな おかずを いれよう</div>
  <div class="stars" id="stars"></div>
  <div id="box"><div id="boxpic"></div><div id="slots"></div></div>
  <div id="palette"></div>
  <button id="done" type="button">できた！</button>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>

<script src="common.js?v=202609221919"></script>
<script src="catalog.js?v=202609221919"></script>
<script>
(() => {
  'use strict';

  const { SFX, say, sayThen, burst, animate, cheer, celebrate, setupStart, setupHome, shuffle, pick } = Baby;
  const ITEMS = [['onigiri', 'おにぎり', '🍙'], ['tamagoyaki', 'たまごやき', '🍳'], ['wiener', 'ウインナー', '🌭'], ['broccoli', 'ブロッコリー', '🥦'],
                 ['tomato', 'ミニトマト', '🍅'], ['karaage', 'からあげ', '🍗'], ['strawberry', 'いちご', '🍓'], ['grape', 'ぶどう', '🍇']];
  const slots = document.getElementById('slots'), palette = document.getElementById('palette'), boxpic = document.getElementById('boxpic');
  const stars = document.getElementById('stars');
  const state = { busy: false, score: Baby.getLevel() };

  function win(after) {
    state.score++; Baby.setLevel(state.score);
    stars.textContent = '⭐'.repeat(((state.score - 1) % 5) + 1);
    return (state.score % 5 === 0 ? Baby.reward() : Promise.resolve()).then(after);
  }
  { const im = new Image(); im.src = 'assets/bento/box.png'; im.alt = ''; im.onload = () => boxpic.appendChild(im); im.onerror = () => boxpic.classList.add('emoji'); }
  for (let i = 0; i < 6; i++) { const s = document.createElement('div'); s.className = 'slot'; slots.appendChild(s); }
  ITEMS.forEach((it, i) => { const p = document.createElement('div'); p.className = 'pal'; p.dataset.i = i; p.appendChild(Baby.pic(`assets/bento/${it[0]}.png`, it[2])); palette.appendChild(p); });
  function reset() { state.busy = false; slots.querySelectorAll('.slot').forEach(s => s.innerHTML = ''); say('すきな おかずを いれよう'); }
  palette.addEventListener('pointerdown', (e) => {
    const p = e.target.closest('.pal'); if (!p || state.busy) return; e.preventDefault();
    const it = ITEMS[Number(p.dataset.i)];
    const empty = [...slots.children].find(s => !s.children.length);
    if (!empty) { SFX.wrong(); say('もう いっぱいだよ'); return; }
    const pic = Baby.pic(`assets/bento/${it[0]}.png`, it[2]); empty.appendChild(pic); empty.dataset.name = it[1]; animate(pic, 'bounce', 400);
    SFX.pop(); burst(e.clientX, e.clientY, 4); say(it[1]);
  });
  slots.addEventListener('pointerdown', (e) => {
    const s = e.target.closest('.slot'); if (!s || state.busy || !s.children.length) return; e.preventDefault();
    s.innerHTML = ''; delete s.dataset.name; SFX.flip();
  });
  document.getElementById('done').addEventListener('pointerdown', (e) => {
    e.preventDefault(); if (state.busy) return;
    const names = [...slots.children].filter(s => s.dataset.name).map(s => s.dataset.name);
    if (!names.length) { SFX.wrong(); say('おかずを いれてね'); return; }
    state.busy = true; SFX.fanfare(); cheer('🍱'); celebrate();
    Baby.say(['おいしそうな おべんとう！ できた！', 'いただきます！'], { delay: 300 }).then(() => win(reset));
  });
  setupStart(() => setTimeout(reset, 300));
  setupHome();

})();
</script>
</body>
</html>
