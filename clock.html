<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>とけい</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e3f2fd">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="game.css">
<style>
  body { background: linear-gradient(180deg, #e3f2fd 0%, #f5fbff 100%); }
  #clockBox { flex: 1.4; min-height: 0; display: flex; align-items: center; justify-content: center; }
  svg { height: 100%; max-height: 100%; aspect-ratio: 1; }
  .choices { flex: 0.7; }
  .choice { font-size: min(9vw, 40px); font-weight: bold; color: #345; background: #fff; }
  .choice small { font-size: .6em; }
</style>
</head>
<body>

<div id="start"><div class="big">🕒</div><div>タッチしてね</div></div>

<div id="stage">
  <div class="question" id="question">なんじ？</div>
  <div class="stars" id="stars"></div>
  <div id="clockBox">
    <svg id="clock" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="96" fill="#fff" stroke="#4a90c2" stroke-width="6"/>
      <g id="nums"></g>
      <line id="minute" x1="100" y1="100" x2="100" y2="30" stroke="#90a4ae" stroke-width="6" stroke-linecap="round"/>
      <line id="hour" x1="100" y1="100" x2="100" y2="55" stroke="#e53935" stroke-width="10" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="7" fill="#345"/>
    </svg>
  </div>
  <div class="choices" id="choices"></div>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>
<button id="replay" class="topbtn right" type="button">🔊</button>

<script src="common.js"></script>
<script>
(() => {
  'use strict';
  const { SFX, say, sayThen, burst, animate, setupStart, setupHome, shuffle } = Baby;
  const READ = ['', 'いちじ', 'にじ', 'さんじ', 'よじ', 'ごじ', 'ろくじ', 'しちじ', 'はちじ', 'くじ', 'じゅうじ', 'じゅういちじ', 'じゅうにじ'];
  const nums = document.getElementById('nums');
  for (let h = 1; h <= 12; h++) {
    const a = (h / 12) * Math.PI * 2;
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', 100 + Math.sin(a) * 76); t.setAttribute('y', 100 - Math.cos(a) * 76 + 8);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '22'); t.setAttribute('font-weight', 'bold'); t.setAttribute('fill', '#345');
    t.textContent = h; nums.appendChild(t);
  }
  const hourHand = document.getElementById('hour'), minHand = document.getElementById('minute');
  const choices = document.getElementById('choices');
  const stars = document.getElementById('stars');
  const state = { h: 0, half: false, opts: [], busy: false, score: Baby.getLevel() };

  function setHands(h, half) {
    const ha = ((h % 12) / 12 + (half ? 1 / 24 : 0)) * 360;
    hourHand.setAttribute('transform', `rotate(${ha} 100 100)`);
    minHand.setAttribute('transform', `rotate(${half ? 180 : 0} 100 100)`);
  }
  const label = (h, half) => `${h}じ${half ? 'はん' : ''}`;
  const read = (h, half) => `${READ[h]}${half ? 'はん' : ''}`;
  function ask() { say('なんじ かな？'); }

  function newRound() {
    state.busy = false;
    state.h = Baby.fresh('clock', () => 1 + Math.floor(Math.random() * 12), String);
    state.half = Baby.level() >= 2 && Math.random() < 0.5;     // レベル2から「はん」も出す
    setHands(state.h, state.half);
    const set = new Set([state.h]);
    while (set.size < 3) set.add(1 + Math.floor(Math.random() * 12));
    state.opts = shuffle([...set]);
    Baby.prime([`${read(state.h, state.half)}！`, 'ちがうよ。', 'あかい みじかい はりを みてね']);
    choices.innerHTML = '';
    for (const h of state.opts) {
      const c = document.createElement('div');
      c.className = 'choice'; c.dataset.h = h;
      c.innerHTML = `${h}<small>じ${state.half ? 'はん' : ''}</small>`;
      choices.appendChild(c);
    }
    ask();
  }

  choices.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.choice');
    if (!c || state.busy) return;
    e.preventDefault();
    burst(e.clientX, e.clientY, 5);
    if (Number(c.dataset.h) === state.h) {
      state.busy = true;
      animate(c, 'glow', 900);
      SFX.correct();
      state.score++; Baby.setLevel(state.score);
      stars.textContent = '⭐'.repeat(((state.score - 1) % 5) + 1);
      sayThen([Baby.praise(), `${read(state.h, state.half)}！`], { delay: 300 }, () => {
        if (state.score % 5 === 0) Baby.reward().then(newRound); else newRound();
      }, 600);
    } else {
      animate(c, 'shake', 400);
      SFX.wrong();
      say(['ちがうよ。', 'あかい みじかい はりを みてね'], { delay: 100 });
    }
  });

  document.getElementById('replay').addEventListener('pointerdown', (e) => { e.preventDefault(); if (!state.busy) ask(); });
  setupStart(() => setTimeout(newRound, 400));
  setupHome();
})();
</script>
</body>
</html>
