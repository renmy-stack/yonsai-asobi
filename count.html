<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>かぞえよう</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff4c8">
<link rel="stylesheet" href="common.css">
<style>
  body { background: linear-gradient(180deg, #fff4c8 0%, #ffe9a8 100%); }
  #stage { display: flex; flex-direction: column; gap: 12px; }
  #question {
    text-align: center; font-size: 22px; font-weight: bold; color: #6a4a00;
    min-height: 30px;
  }
  #field {
    flex: 1; min-height: 0;
    position: relative;
    border-radius: 28px;
    background: var(--card);
    box-shadow: 0 6px 0 rgba(0,0,0,.08);
  }
  .thing {
    position: absolute;
    width: 26%; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    transition: filter .2s;
  }
  .thing .face { width: 100%; height: 100%; display: block; }
  .thing .face img { width: 100%; height: 100%; object-fit: contain; }
  .thing .face.emoji { display: flex; align-items: center; justify-content: center; font-size: min(18vmin, 90px); }
  .thing .tag {
    position: absolute; top: -6px; right: -6px;
    width: 34px; height: 34px; border-radius: 50%;
    background: #ff8c42; color: #fff;
    font-weight: bold; font-size: 20px;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
  }
  .thing.counted .tag { display: flex; }
  #numbers {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    height: 22%;
  }
  .num {
    border: none; border-radius: 24px;
    background: #fff; color: #345;
    font-size: min(14vw, 64px); font-weight: bold;
    box-shadow: 0 6px 0 rgba(0,0,0,.12);
    font-family: inherit;
    touch-action: none;
  }
  .num:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .num.ok { background: var(--accent); }
</style>
</head>
<body>

<div id="start"><div class="big">🔢</div><div>タッチしてね</div></div>

<div id="stage">
  <div id="question"></div>
  <div id="field"></div>
  <div id="numbers"></div>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>
<button id="replay" class="topbtn right" type="button">🔊</button>

<script src="common.js"></script>
<script src="catalog.js"></script>
<script>
(() => {
  'use strict';
  const { SFX, say, sayThen, burst, animate, cheer, celebrate, setupStart, setupHome, shuffle, pick } = Baby;
  const READ = ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく'];
  const SETS = [CATALOG.animals, CATALOG.vehicles, CATALOG.foods];

  const field = document.getElementById('field');
  const numbers = document.getElementById('numbers');
  const question = document.getElementById('question');

  const state = { round: 0, n: 0, counted: 0, item: null, busy: false };

  // 重ならないように配置する（ざっくりランダム、失敗したら格子）
  function placeThings(n) {
    const spots = [];
    const W = 100 - 26, H = 100 - 26;       // 配置できる範囲（%）
    for (let i = 0; i < n; i++) {
      let ok = false, x = 0, y = 0;
      for (let t = 0; t < 60 && !ok; t++) {
        x = Math.random() * W; y = Math.random() * H;
        ok = spots.every(s => Math.hypot(s.x - x, s.y - y) > 28);
      }
      if (!ok) { x = (i % 3) * 37; y = Math.floor(i / 3) * 37; }
      spots.push({ x, y });
    }
    return spots;
  }

  function ask() {
    // 助数詞はものによって変わる（いぬ→なんびき、くるま→なんだい、りんご→なんこ）
    if (question.textContent) say(`${state.item.name}は ${COUNTERS[state.item.counter].q} かな？`);
  }

  function newRound() {
    state.round++;
    state.busy = false;
    state.counted = 0;
    // 最初の2回は 1〜3、そのあと 1〜5
    const max = state.round <= 2 ? 3 : 5;
    state.n = 1 + Math.floor(Math.random() * max);
    // 直前と同じものは出さない
    const { set, item } = Baby.fresh('count', () => { const s = pick(SETS); return { set: s, item: pick(s.items) }; }, v => v.item.id);
    state.item = item;

    field.innerHTML = '';
    for (const s of placeThings(state.n)) {
      const t = document.createElement('div');
      t.className = 'thing';
      t.style.left = `${s.x}%`; t.style.top = `${s.y}%`;
      t.appendChild(makeFace(set, state.item));
      const tag = document.createElement('span'); tag.className = 'tag'; t.appendChild(tag);
      field.appendChild(t);
    }

    // 答えの候補: 正解 + 近い数字2つ
    const cand = new Set([state.n]);
    while (cand.size < 3) cand.add(Math.max(1, Math.min(6, state.n + Math.floor(Math.random() * 5) - 2)));
    numbers.innerHTML = '';
    for (const v of shuffle([...cand])) {
      const b = document.createElement('button');
      b.className = 'num'; b.type = 'button'; b.textContent = v; b.dataset.v = v;
      numbers.appendChild(b);
    }
    question.textContent = `${state.item.name}は ${COUNTERS[state.item.counter].q}？`;
    ask();
  }

  // ものをタッチ → 数えていく
  field.addEventListener('pointerdown', (e) => {
    const t = e.target.closest('.thing');
    if (!t || state.busy) return;
    e.preventDefault();
    animate(t.querySelector('.face'), 'bounce', 600);
    burst(e.clientX, e.clientY, 5);
    if (t.classList.contains('counted')) { SFX.pop(); return; }
    state.counted++;
    t.classList.add('counted');
    t.querySelector('.tag').textContent = state.counted;
    SFX.count(state.counted);
    say(READ[state.counted], { delay: 50, rate: 1.05 });
  });

  numbers.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.num');
    if (!b || state.busy) return;
    e.preventDefault();
    const v = Number(b.dataset.v);
    if (v === state.n) {
      state.busy = true;
      b.classList.add('ok');
      SFX.correct();
      cheer('🎉');
      celebrate(e.clientX, e.clientY);
      state.score = (state.score || 0) + 1;
      // 言い終わってから次へ（途中で切れないように）
      sayThen(['せいかい！', `${state.item.name}は`, `${countWord(state.item, state.n)}！`], { delay: 300 }, () => { if (state.score % 5 === 0) Baby.reward().then(newRound); else newRound(); }, 800);
    } else {
      animate(b, 'shake', 400);
      SFX.wrong();
      say([`${READ[v]}じゃないよ。`, `${state.item.name}を`, 'タッチして かぞえてみよう'], { delay: 300 });
    }
  });

  document.getElementById('replay').addEventListener('pointerdown', (e) => { e.preventDefault(); ask(); });

  setupStart(() => setTimeout(newRound, 600));
  setupHome();
})();
</script>
</body>
</html>
