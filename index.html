<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>4さいの あそび</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="あそぼ">
<meta name="theme-color" content="#8fd3ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="common.css?v=202609221802">
<style>
  body {
    background:
      radial-gradient(circle at 12% 18%, #fff 0 34px, transparent 35px),
      radial-gradient(circle at 20% 22%, #fff 0 44px, transparent 45px),
      radial-gradient(circle at 28% 17%, #fff 0 30px, transparent 31px),
      radial-gradient(circle at 78% 10%, #fff 0 28px, transparent 29px),
      radial-gradient(circle at 86% 14%, #fff 0 38px, transparent 39px),
      radial-gradient(circle at 94% 9%, #fff 0 24px, transparent 25px),
      linear-gradient(180deg, #8fd3ff 0%, #c9ecff 45%, #d7f7c8 100%);
  }
  #stage {
    padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px)
             calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px);
    display: flex; flex-direction: column; gap: 8px;
  }
  header { display: flex; align-items: center; gap: 6px; height: 56px; }
  header .title { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; }
  header img.mascot { height: 52px; width: 52px; flex: 0 0 auto; object-fit: contain; animation: wiggle 2.4s ease-in-out infinite; }
  header h1 {
    margin: 0; font-size: min(5.4vw, 24px); color: #fff; white-space: nowrap; overflow: hidden;
    text-shadow: 0 2px 0 #4a90c2, 0 4px 0 rgba(0,0,0,.12); letter-spacing: 1px;
  }
  #stickerBtn {
    flex: 0 0 auto; height: 46px; padding: 0 10px 0 6px; border-radius: 23px; border: 3px solid #ffb300;
    background: #fff; text-decoration: none; color: #7a5200; font-weight: bold; font-size: 15px;
    display: flex; align-items: center; gap: 4px; box-shadow: 0 4px 0 #ffb300;
  }
  #stickerBtn img { width: 30px; height: 30px; object-fit: contain; }
  #stickerBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #ffb300; }
  #parentBtn { flex: 0 0 auto; position: relative; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,.5); font-size: 20px; touch-action: none; overflow: hidden; }
  #parentBtn::after { content: ""; position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: #ff8c42; }
  #parentBtn.holding::after { width: 100%; transition: width 2s linear; }

  /* カテゴリのタブ */
  #tabs { display: flex; gap: 6px; }
  .tab {
    flex: 1; height: 58px; border: 3px solid rgba(255,255,255,.7); border-radius: 18px;
    background: rgba(255,255,255,.55); color: #345; font-family: inherit; font-weight: bold; font-size: clamp(9px, 2.8vw, 12px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    touch-action: none; min-width: 0; padding: 0 1px; white-space: nowrap; letter-spacing: -0.5px;   /* 6タブでも折り返さない */
  }
  .tab .ic { font-size: 22px; line-height: 1; height: 26px; display: flex; align-items: center; justify-content: center; }
  .tab .ic img { height: 26px; width: 26px; object-fit: contain; }
  .tab.on { background: #fff; border-color: var(--edge, #ffb74d); box-shadow: 0 4px 0 var(--edge, #ffb74d); transform: translateY(-2px); }
  .tab[data-cat="kazu"]    { --edge: #ffb74d; }
  .tab[data-cat="atama"]   { --edge: #ff8a65; }
  .tab[data-cat="kotoba"]  { --edge: #ba68c8; }
  .tab[data-cat="ugoki"]   { --edge: #4fc3f7; }
  .tab[data-cat="tsukuru"] { --edge: #f48fb1; }
  .tab[data-cat="seikatsu"] { --edge: #81c784; }

  .menu { flex: 1; min-height: 0; display: grid; gap: 8px; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; }
  .menu.many { grid-template-columns: repeat(4, 1fr); }
  .menu.few { grid-template-rows: repeat(3, 1fr); }   /* 3つ以下のときは縦長にしない */
  @media (orientation: landscape) { .menu, .menu.many { grid-template-columns: repeat(6, 1fr); } }
  .tile {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    border-radius: 18px; background: #fff; box-shadow: 0 5px 0 var(--edge, #cfd8dc);
    text-decoration: none; min-height: 0; overflow: hidden; border: 3px solid var(--edge, #cfd8dc);
    animation: tile-in .25s ease both;
  }
  @keyframes tile-in { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .tile:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--edge); }
  .tile .pic { position: absolute; inset: 4px 4px 24px; display: flex; align-items: center; justify-content: center; font-size: min(9vmin, 44px); line-height: 1; }
  .tile .pic img { width: 100%; height: 100%; object-fit: contain; }
  .tile .name {
    width: 100%; height: 22px; display: flex; align-items: center; justify-content: center;
    background: var(--edge, #cfd8dc); color: #fff; font-size: 11px; font-weight: bold;
    text-shadow: 0 1px 0 rgba(0,0,0,.15); white-space: nowrap;
  }
  .tile .lv { position: absolute; top: 4px; right: 4px; height: 22px; padding: 0 6px; border-radius: 11px; background: rgba(255,255,255,.9); font-size: 12px; font-weight: bold; color: #5a4300; display: flex; align-items: center; gap: 2px; box-shadow: 0 2px 0 rgba(0,0,0,.1); }
  .kazu    { --edge: #ffb74d; }
  .atama   { --edge: #ff8a65; }
  .kotoba  { --edge: #ba68c8; }
  .ugoki   { --edge: #4fc3f7; }
  .tsukuru { --edge: #f48fb1; }
  .seikatsu { --edge: #81c784; }
  .note { font-size: 11px; color: #4a6b8a; text-align: center; margin: 0; }
  /* おうちのひと用の計算ゲート */
  #gate { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: rgba(40,50,70,.85); }
  #gate.show { display: flex; }
  #gate .box { background: #fff; border-radius: 20px; padding: 18px 20px; width: min(86vw, 340px); text-align: center; color: #345; }
  #gate .q { font-size: 22px; font-weight: bold; margin-bottom: 12px; }
  #gate .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  #gate .nums button { height: 46px; border: none; border-radius: 12px; background: #eceff1; font-size: 20px; font-weight: bold; font-family: inherit; }
  #gate .cancel { margin-top: 12px; background: none; border: none; color: #789; font-size: 14px; font-family: inherit; }
</style>
</head>
<body>

<div id="stage">
  <header>
    <button id="parentBtn" type="button" aria-label="おうちのひと（長押し）">⚙️</button>
    <div class="title">
      <img class="mascot" src="assets/icons/mascot.png" alt="" onerror="this.src='assets/animals/dog.png'">
      <h1>4さいの あそび</h1>
    </div>
    <a id="stickerBtn" href="stickers.html" aria-label="シールちょう"><img src="assets/icons/trophy.png" alt=""><span id="stickerCount"></span></a>
  </header>
  <div id="tabs"></div>
  <div class="menu" id="menu"></div>
  <p class="note">🏠 を1.5秒長押しでもどる ／ ⚙️ を2秒長押しで おうちのひと（計算あり）</p>
  <div id="gate"><div class="box"><div class="q" id="gateQ"></div><div class="nums" id="gateNums"></div><button class="cancel" id="gateCancel" type="button">やめる</button></div></div>
</div>

<script src="common.js?v=202609221802"></script>
<script src="games.js?v=202609221802"></script>
<script>
(() => {
  const d = Baby.load();
  const disabled = new Set(d.settings.disabled || []);
  const menu = document.getElementById('menu');
  const tabs = document.getElementById('tabs');
  let current = (d.settings.lastTab && CATEGORIES.some(c => c.id === d.settings.lastTab)) ? d.settings.lastTab : CATEGORIES[0].id;

  // タブ（カテゴリ）。前回開いていたタブを覚えておく
  for (const c of CATEGORIES) {
    const b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.dataset.cat = c.id;
    b.appendChild(Baby.pic(`assets/misc/tab-${c.id}.png`, c.icon, 'ic')); b.appendChild(document.createTextNode(c.name));
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); Baby.ensureAudio(); Baby.SFX.flip(); show(c.id); });
    tabs.appendChild(b);
  }

  function show(cat) {
    current = cat;
    [...tabs.children].forEach(t => t.classList.toggle('on', t.dataset.cat === cat));
    const list = GAMES.filter(g => g.cat === cat && !disabled.has(g.id));
    menu.classList.toggle('many', list.length > 9);
    menu.classList.toggle('few', list.length <= 3);
    menu.innerHTML = '';
    list.forEach((g, i) => { try {
      const a = document.createElement('a');
      a.className = `tile ${g.cat}`;
      a.href = `${g.id}.html`;
      a.style.animationDelay = `${i * 25}ms`;
      const pic = document.createElement('div'); pic.className = 'pic';
      const img = document.createElement('img');
      img.src = `assets/icons/${g.id}.png`; img.alt = '';
      img.onerror = () => { pic.textContent = g.icon; };      // 絵がまだ無ければ絵文字
      pic.appendChild(img);
      const name = document.createElement('div'); name.className = 'name'; name.textContent = g.name;
      a.append(pic, name);
      // 遊んだことがあるゲームはレベル（メダル）を出す
      const sc = (d.levels || {})[g.id];
      try { if (sc > 0 && Baby.NO_LEVEL && !Baby.NO_LEVEL.includes(g.id)) { const lvEl = document.createElement('div'); lvEl.className = 'lv'; const lv = Baby.levelOf(sc); lvEl.textContent = `${Baby.MEDALS[lv]}${lv}`; a.appendChild(lvEl); } } catch (_) {}
      a.addEventListener('pointerdown', () => { Baby.ensureAudio(); Baby.SFX.pop(); });
      menu.appendChild(a);
    } catch (err) { console.warn('tile', g.id, err); } });
    const dd = Baby.load(); dd.settings.lastTab = cat; Baby.save(dd);
  }
  show(current);

  const n = d.stickers.length;
  document.getElementById('stickerCount').textContent = n ? `${n}` : '';

  // タイトル（親ページで変更できる）
  const title = (d.settings.title || '').trim() || '4さいの あそび';
  document.querySelector('header h1').textContent = title;
  document.title = title;

  // ⚙️ 長押し → 計算の問題に答えたら「おうちのひと」ページへ（子どもが偶然入らないように）
  const gate = document.getElementById('gate');
  Baby.holdButton(document.getElementById('parentBtn'), () => {
    const a = 3 + Math.floor(Math.random() * 6), b = 2 + Math.floor(Math.random() * 6);
    document.getElementById('gateQ').textContent = `${a} + ${b} = ?`;
    const nums = document.getElementById('gateNums'); nums.innerHTML = '';
    for (let k = 5; k <= 14; k++) {
      const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = k;
      btn.addEventListener('click', () => { if (k === a + b) location.href = 'parent.html'; else { gate.classList.remove('show'); Baby.SFX.wrong(); } });
      nums.appendChild(btn);
    }
    gate.classList.add('show');
  }, 2000);
  document.getElementById('gateCancel').addEventListener('click', () => gate.classList.remove('show'));

  // オフライン対応（https のときだけ有効）
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
