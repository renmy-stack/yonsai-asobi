<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>すごろく</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff8e1">
<link rel="stylesheet" href="common.css?v=202609221934">
<link rel="stylesheet" href="game.css?v=202609221934">
<style>
  body { background: linear-gradient(180deg, #fff8e1 0%, #ffe9a8 100%); }
  #board { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr); gap: 6px; padding: 6px; border-radius: 22px; background: rgba(255,255,255,.5); }
  .sq { position: relative; border-radius: 12px; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.08); display: flex; align-items: center; justify-content: center; font-size: min(7vw, 30px); }
  .sq.ev { background: #ffe0b2; } .sq.good { background: #c8e6c9; } .sq.bad { background: #ffcdd2; }
  .sq .n { position: absolute; top: 2px; left: 6px; font-size: 11px; color: #aaa; }
  .sq .p { position: absolute; font-size: min(8vw, 36px); transition: all .3s; }
  .sq .sqpic { width: 55%; height: 55%; display: flex; align-items: center; justify-content: center; }
  .sq .sqpic img { width: 100%; height: 100%; object-fit: contain; }
  .sq .tok { display: flex; width: min(9vw, 40px); height: min(9vw, 40px); }
  .sq .tok img { width: 100%; height: 100%; object-fit: contain; }
  .sq .p.me { left: 4px; bottom: 2px; } .sq .p.cpu { right: 4px; bottom: 2px; }
  #ctrl { display: flex; align-items: center; justify-content: center; gap: 14px; height: 15%; }
  #dice { width: 84px; height: 84px; border-radius: 20px; border: none; background: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.15); font-size: 48px; touch-action: none; }
  #dice:disabled { opacity: .5; }
  #dice.roll { animation: shake .4s infinite; }
  #turn { font-size: 20px; font-weight: bold; color: #6a4a00; }
</style>
</head>
<body>

<div id="start"><div class="big">🎲</div><div>タッチしてね</div></div>

<div id="stage">
  <div class="question" id="question">すごろく</div>
  <div id="board"></div>
  <div id="ctrl"><span id="turn"></span><button id="dice" type="button">🎲</button></div>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>

<script src="common.js?v=202609221934"></script>
<script>
(() => {
  'use strict';
  const { SFX, say, burst, celebrate, cheer, setupStart, setupHome, pick, tone } = Baby;
  const N = 20;
  const READ = ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく'];
  const EVENTS = [
    { icon: '➕', img: 'assets/misc/plus.png', cls: 'good', move: 2, line: '2ます すすむ！' },
    { icon: '➖', img: 'assets/misc/minus.png', cls: 'bad', move: -1, line: '1ます もどる' },
    { icon: '🐶', img: 'assets/animals/dog.png', cls: 'ev', line: 'いぬの まねを してみよう！' },
    { icon: '🎵', img: 'assets/misc/note.png', cls: 'ev', line: 'うたを うたおう！' },
    { icon: '🐘', img: 'assets/animals/elephant.png', cls: 'ev', line: 'ぞうさんの まねを してみよう！' },
    { icon: '⭐', img: 'assets/misc/star.png', cls: 'good', move: 1, line: 'ラッキー！ 1ます すすむ' },
    { icon: '🐸', img: 'assets/animals/frog.png', cls: 'ev', line: 'かえるみたいに ジャンプ！' },
  ];
  const board = document.getElementById('board');
  const dice = document.getElementById('dice');
  const turnEl = document.getElementById('turn');
  const state = { pos: [0, 0], turn: 0, busy: false, squares: [], wins: Baby.getLevel() };   // 0 = きみ, 1 = ずんだもん

  // 蛇行する盤（5x4）
  const order = [];
  for (let r = 3; r >= 0; r--) { const row = []; for (let c = 0; c < 5; c++) row.push(r * 5 + c); if ((3 - r) % 2) row.reverse(); order.push(...row); }
  function build() {
    board.innerHTML = ''; state.squares = [];
    const cells = new Array(N);
    order.forEach((cellIdx, i) => {
      const sq = document.createElement('div'); sq.className = 'sq';
      let ev = null;
      if (i === 0) sq.appendChild(Baby.pic('assets/misc/flag-start.png', '🚩', 'sqpic')); else if (i === N - 1) sq.appendChild(Baby.pic('assets/misc/flag-goal.png', '🏁', 'sqpic'));
      else if (Math.random() < 0.4) { ev = pick(EVENTS); sq.appendChild(Baby.pic(ev.img, ev.icon, 'sqpic')); sq.classList.add(ev.cls); }
      const n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
      const me = document.createElement('span'); me.className = 'p me'; const cpu = document.createElement('span'); cpu.className = 'p cpu';
      sq.append(n, me, cpu);
      cells[cellIdx] = sq; state.squares[i] = { el: sq, ev };
    });
    cells.forEach(c => board.appendChild(c));
    draw();
  }
  function draw() {
    state.squares.forEach((s, i) => {
      const me = s.el.querySelector('.me'), cpu = s.el.querySelector('.cpu'); me.innerHTML = ''; cpu.innerHTML = '';
      if (state.pos[0] === i) me.appendChild(Baby.pic('assets/misc/child.png', '👦', 'tok'));
      if (state.pos[1] === i) cpu.appendChild(Baby.pic('assets/icons/zundamon.png', '🟢', 'tok'));
    });
  }
  async function move(who, n) {
    for (let i = 0; i < n && state.pos[who] < N - 1; i++) {
      state.pos[who]++; draw(); tone({ type: 'sine', f0: 500 + i * 60, dur: 0.08, gain: 0.12 });
      await new Promise(r => setTimeout(r, 320));
    }
  }
  async function turn() {
    const who = state.turn;
    turnEl.textContent = who === 0 ? 'きみの ばん' : 'ずんだもんの ばん';
    dice.disabled = who !== 0;
    await Baby.say(who === 0 ? 'きみの ばん！ さいころを ふって！' : 'ずんだもんの ばん');
    if (who === 1) setTimeout(roll, 600);
  }
  async function roll() {
    if (state.busy) return; state.busy = true; dice.disabled = true;
    dice.classList.add('roll'); SFX.flip();
    await new Promise(r => setTimeout(r, 600));
    const n = 1 + Math.floor(Math.random() * 6);
    dice.classList.remove('roll'); dice.textContent = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'][n];
    await Baby.say(`${READ[n]}！`);
    const who = state.turn;
    await move(who, n);
    if (state.pos[who] >= N - 1) return win(who);
    const ev = state.squares[state.pos[who]].ev;
    if (ev) {
      await Baby.say(ev.line);
      if (ev.move) { if (ev.move > 0) await move(who, ev.move); else { state.pos[who] = Math.max(0, state.pos[who] + ev.move); draw(); SFX.wrong(); await new Promise(r => setTimeout(r, 400)); } }
      else await new Promise(r => setTimeout(r, 2500));   // まねをする時間
      if (state.pos[who] >= N - 1) return win(who);
    }
    state.turn = 1 - who; state.busy = false; dice.textContent = '🎲';
    turn();
  }
  async function win(who) {
    SFX.fanfare(); cheer(who === 0 ? '🎉' : '🟢'); celebrate();
    await Baby.say(who === 0 ? 'ゴール！ きみの かち！' : 'ずんだもんの かち！ もういっかい？', { delay: 300 });
    if (who === 0) { state.wins++; Baby.setLevel(state.wins); await Baby.reward(); }
    state.pos = [0, 0]; state.turn = 0; state.busy = false; dice.textContent = '🎲';
    build(); turn();
  }
  dice.addEventListener('pointerdown', (e) => { e.preventDefault(); if (state.turn === 0) roll(); });
  setupStart(() => { build(); setTimeout(turn, 400); });
  setupHome();
})();
</script>
</body>
</html>
