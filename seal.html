<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>シールあそび</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff8e1">
<link rel="stylesheet" href="common.css?v=202609231416">
<link rel="stylesheet" href="game.css?v=202609231416">
<style>
  :root { --tray: calc(112px + env(safe-area-inset-bottom)); }
  html, body { touch-action: pan-x; }   /* common.css の touch-action: none を打ち消す（棚の横スクロール用）。絵の上は #scene 自身が none */
  body { background: #fff8e1; overflow: hidden; }
  /* 背景の絵。シールはこの上に絶対配置 */
  #scene { position: fixed; left: 0; right: 0; top: 0; bottom: var(--tray); overflow: hidden; touch-action: none; background: linear-gradient(180deg, #bfe3ff 0%, #e8f6ff 60%, #c8e6a0 60%, #a5d17a 100%); }
  #scene img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .seal { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; /* common.css の img { pointer-events: none } を打ち消す */ user-select: none; -webkit-user-drag: none; touch-action: none; will-change: left, top; -webkit-backface-visibility: hidden; backface-visibility: hidden; }   /* 影（filter）は Safari で動かした跡が残るので付けない */
  .seal.flip { transform: translate(-50%, -50%) scaleX(-1); }
  .seal.sel { outline: 4px dashed #ff8c42; outline-offset: 6px; border-radius: 14px; }
  .seal.pop { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: translate(-50%, -50%) scale(.2); } 70% { transform: translate(-50%, -50%) scale(1.15); } 100% { transform: translate(-50%, -50%) scale(1); } }
  /* 上: 背景えらび */
  #scenes { position: fixed; top: calc(env(safe-area-inset-top) + 62px); left: 10px; right: 10px; display: flex; justify-content: center; gap: 6px; z-index: 5; pointer-events: none; }   /* 🏠 📷 と重ならないよう2段目 */
  #scenes button { pointer-events: auto; height: 36px; padding: 0 9px; border-radius: 18px; border: none; background: rgba(255,255,255,.92); box-shadow: 0 3px 0 rgba(0,0,0,.12); font-size: 14px; font-weight: bold; color: #345; font-family: inherit; touch-action: none; white-space: nowrap; }
  #scenes button.on { background: #ffd84d; }
  /* 選んだシールの道具 */
  #tools { position: fixed; left: 0; right: 0; bottom: calc(var(--tray) + 10px); padding: 0 56px; display: none; flex-wrap: wrap; justify-content: center; gap: 8px; z-index: 5; pointer-events: none; }   /* iPhone の幅では 2×2 に折り返す */
  #tools.show { display: flex; }
  #tools button { pointer-events: auto; height: 42px; padding: 0 12px; border-radius: 22px; border: none; background: rgba(255,255,255,.95); box-shadow: 0 3px 0 rgba(0,0,0,.15); font-size: 15px; font-weight: bold; color: #345; font-family: inherit; touch-action: none; white-space: nowrap; }
  #tools button.danger { color: #c62828; }
  /* 下: 持っているシール */
  #tray { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tray); box-sizing: border-box; padding: 10px 10px calc(env(safe-area-inset-bottom) + 10px); background: rgba(255,255,255,.95); box-shadow: 0 -2px 8px rgba(0,0,0,.08); display: flex; gap: 8px; align-items: center; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; -webkit-overflow-scrolling: touch; }
  .chip { flex: 0 0 auto; width: 84px; height: 84px; border-radius: 18px; background: #fffbe6; box-shadow: 0 3px 0 rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center; }
  .chip:active { transform: scale(.94); }
  .chip.on { box-shadow: 0 0 0 4px #ff8c42, 0 3px 0 rgba(0,0,0,.12); }
  .chip { position: relative; }
  .chip .n { position: absolute; right: 4px; bottom: 4px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: #ff8c42; color: #fff; font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
  .chip.out { opacity: .45; }
  .chip.out .n { background: #999; }
  .chip.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .chip img { width: 84%; height: 84%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
  .chip.rare { box-shadow: 0 0 0 3px #ffc107, 0 3px 0 rgba(0,0,0,.12); background: #fff8dc; }
  #emptyMsg { flex: 0 0 auto; color: #a07000; font-size: 15px; font-weight: bold; padding: 0 6px; white-space: nowrap; }
  /* しゃしん */
  #shot { position: fixed; inset: 0; z-index: 45; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(60,60,80,.92); padding: 16px; }
  #shot.show { display: flex; }
  #shot .ttl { color: #fff; font-size: 16px; font-weight: bold; text-align: center; }
  #shot img { max-width: 92vw; max-height: 70vh; border-radius: 16px; background: #fff; box-shadow: 0 8px 0 rgba(0,0,0,.2); -webkit-touch-callout: default; pointer-events: auto; }
  #shot button { height: 44px; padding: 0 18px; border-radius: 22px; border: none; background: #fff; font-size: 16px; font-weight: bold; color: #345; font-family: inherit; touch-action: none; }
</style>
</head>
<body>

<div id="scene"><img class="bg" alt=""></div>
<div id="scenes"></div>
<div id="tools">
  <button type="button" data-act="big">🔍 おおきく</button>
  <button type="button" data-act="small">🔍 ちいさく</button>
  <button type="button" data-act="flip">↔️ むき</button>
  <button type="button" class="danger" data-act="del">🗑️ はがす</button>
</div>
<div id="tray"></div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>
<button id="shotBtn" class="topbtn right" type="button" aria-label="しゃしん">📷</button>
<div id="shot"><div class="ttl">できた！ 　えを ながおしすると ほぞんできるよ</div><img alt="シールあそび"><button id="shotClose" type="button">もどる</button></div>

<script src="common.js?v=202609231416"></script>
<script src="catalog.js?v=202609231416"></script>
<script>
(() => {
  'use strict';
  const { SFX, say, burst, setupHome, ensureAudio, load, save } = Baby;
  const SCENES = [
    { id: 'room', name: 'おへや' },
    { id: 'park', name: 'こうえん' },
    { id: 'sea', name: 'うみ' },
    { id: 'space', name: 'うちゅう' },
  ];
  // シールの名前（タッチしたとき言う）
  const NAMES = { 'icons/trophy': 'トロフィー', 'icons/mascot': 'わんちゃん' };
  for (const set of Object.values(CATALOG)) for (const it of set.items) NAMES[`${set.key}/${it.id}`] = it.name;

  const scene = document.getElementById('scene');
  const bg = scene.querySelector('img.bg');
  const tray = document.getElementById('tray');
  const tools = document.getElementById('tools');
  const scenesBar = document.getElementById('scenes');
  // 保存データ: d.seal = { scene: 'room', boards: { room: [{ id, x, y, s, f }] } }
  //   x, y は背景の箱に対する割合（0〜1）、s は短いほうの辺に対する大きさの割合、f は左右反転
  const d = load();
  d.seal = d.seal || { scene: SCENES[0].id, boards: {} };
  if (!SCENES.some(s => s.id === d.seal.scene)) d.seal.scene = SCENES[0].id;
  const state = { sel: null, drag: null };
  const persist = () => save(d);
  const board = () => (d.seal.boards[d.seal.scene] = d.seal.boards[d.seal.scene] || []);
  const box = () => scene.getBoundingClientRect();
  const unit = () => { const r = box(); return Math.min(r.width, r.height); };

  // ---------- 背景 ----------
  SCENES.forEach(s => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = s.name; b.dataset.id = s.id;
    scenesBar.appendChild(b);
  });
  function showScene(id, speak) {
    d.seal.scene = id; persist();
    [...scenesBar.children].forEach(b => b.classList.toggle('on', b.dataset.id === id));
    bg.style.display = '';
    bg.onerror = () => { bg.style.display = 'none'; };   // 絵が無ければグラデーションのまま
    bg.src = `assets/scenes/${id}.jpg`;
    select(null);
    render();
    if (speak) say(SCENES.find(s => s.id === id).name);
  }
  scenesBar.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('button'); if (!b) return; e.preventDefault(); ensureAudio();
    if (b.dataset.id === d.seal.scene) return;
    SFX.pop(); showScene(b.dataset.id, true);
  });

  // ---------- 貼ってあるシールを描く ----------
  function render() {
    scene.querySelectorAll('.seal').forEach(el => el.remove());
    board().forEach((it, i) => scene.appendChild(makeSeal(it, i)));
  }
  function makeSeal(it, i) {
    const el = document.createElement('img');
    el.className = 'seal' + (it.f ? ' flip' : '') + (state.sel === i ? ' sel' : '');
    el.src = `assets/${it.id}.png`; el.alt = ''; el.draggable = false; el.dataset.i = i;
    place(el, it);
    return el;
  }
  function place(el, it) {
    const r = box();
    el.style.left = `${it.x * r.width}px`; el.style.top = `${it.y * r.height}px`;
    el.style.width = `${it.s * unit()}px`;
  }
  window.addEventListener('resize', render);
  function select(i) {
    state.sel = i;
    scene.querySelectorAll('.seal').forEach(el => el.classList.toggle('sel', +el.dataset.i === i));
    tools.classList.toggle('show', i != null);
  }

  // ---------- シールを貼る（下の棚をタッチ → 真ん中に出る → 指で動かす） ----------
  // 持っている枚数（種類ごと）と、いま貼ってある枚数（全部の背景を合わせて）。残りが 0 なら貼れない
  const ownedCount = (id) => d.stickers.filter(s => s.id === id).length;
  const usedCount = (id) => Object.values(d.seal.boards).reduce((n, b) => n + b.filter(it => it.id === id).length, 0);
  const remain = (id) => Math.max(0, ownedCount(id) - usedCount(id));
  function buildTray() {
    tray.innerHTML = '';
    const owned = new Set(d.stickers.map(s => s.id));
    const ids = Baby.STICKERS.filter(id => owned.has(id));
    if (!ids.length) {
      const m = document.createElement('div'); m.id = 'emptyMsg'; m.textContent = 'ゲームで 5もん せいかいすると シールが もらえるよ！';
      tray.appendChild(m);
    }
    ids.forEach(id => {
      const c = document.createElement('div');
      c.className = 'chip' + (Baby.RARE.includes(id) ? ' rare' : ''); c.dataset.id = id;
      c.innerHTML = `<img src="assets/${id}.png" alt=""><span class="n"></span>`;
      tray.appendChild(c);
    });
    refreshTray();
  }
  // 残り枚数の表示だけ更新する（棚のスクロール位置を保つため作り直さない）
  function refreshTray() {
    tray.querySelectorAll('.chip').forEach(c => {
      const r = remain(c.dataset.id);
      c.querySelector('.n').textContent = `×${r}`;
      c.classList.toggle('out', r === 0);
    });
  }
  // 棚のタップは click で受ける（横スクロールと区別してくれる。iPhone では pointerup が来ないことがある）
  let pan = null;
  tray.addEventListener('pointerdown', (e) => { ensureAudio(); pan = { x: e.clientX, left: tray.scrollLeft, moved: false }; });
  tray.addEventListener('pointermove', (e) => {
    if (!pan) return;
    const dx = e.clientX - pan.x;
    if (Math.abs(dx) > 8) pan.moved = true;
    if (pan.moved) tray.scrollLeft = pan.left - dx;
  });
  const panEnd = () => { if (pan && pan.moved) setTimeout(() => { pan = null; }, 0); else pan = null; };
  tray.addEventListener('pointerup', panEnd); tray.addEventListener('pointercancel', panEnd);
  tray.addEventListener('click', (e) => {
    if (pan && pan.moved) return;   // 引っぱっただけ
    const c = e.target.closest('.chip'); if (!c) return;
    [...tray.querySelectorAll('.chip')].forEach(x => x.classList.toggle('on', x === c));
    setTimeout(() => c.classList.remove('on'), 600);
    addSeal(c.dataset.id);
  });
  function addSeal(id) {
    if (remain(id) <= 0) {
      const c = tray.querySelector(`.chip[data-id="${id}"]`);
      if (c) { c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
      SFX.wrong(); say('もう ないよ');
      return;
    }
    const items = board();
    // 真ん中あたりに、少しずつずらして出す（重なりっぱなしにならないように）
    const n = items.length;
    const it = { id, x: 0.5 + [0, -1, 1, -2, 2][n % 5] * 0.08, y: 0.5 + [0, 1, -1][Math.floor(n / 5) % 3] * 0.1, s: 0.24, f: 0 };   // 1枚目は真ん中
    items.push(it); persist();
    const el = makeSeal(it, items.length - 1); el.classList.add('pop'); scene.appendChild(el);
    select(items.length - 1);
    SFX.pop();
    const r = box(); burst(r.left + it.x * r.width, r.top + it.y * r.height, 6);
    say(NAMES[id] || 'シール');
    refreshTray();
  }

  // ---------- 動かす・選ぶ ----------
  scene.addEventListener('pointerdown', (e) => {
    e.preventDefault(); ensureAudio();
    const el = e.target.closest('.seal');
    if (!el) { select(null); return; }
    const i = +el.dataset.i; const it = board()[i];
    // 一番上に持ってくる（配列の最後 = 手前）
    board().splice(i, 1); board().push(it); render(); select(board().length - 1);
    const top = scene.querySelector(`.seal[data-i="${board().length - 1}"]`);
    try { scene.setPointerCapture(e.pointerId); } catch (_) {}
    state.drag = { el: top, it, dx: e.clientX - (box().left + it.x * box().width), dy: e.clientY - (box().top + it.y * box().height) };
  });
  scene.addEventListener('pointermove', (e) => {
    if (!state.drag) return; e.preventDefault();
    const r = box(); const { it, el } = state.drag;
    it.x = Math.min(1, Math.max(0, (e.clientX - state.drag.dx - r.left) / r.width));
    it.y = Math.min(1, Math.max(0, (e.clientY - state.drag.dy - r.top) / r.height));
    place(el, it);
  });
  const drop = () => { if (state.drag) { state.drag = null; persist(); } };
  scene.addEventListener('pointerup', drop); scene.addEventListener('pointercancel', drop);

  // ---------- 道具（おおきく・ちいさく・むき・はがす） ----------
  tools.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('button'); if (!b || state.sel == null) return; e.preventDefault();
    const items = board(); const it = items[state.sel]; if (!it) return;
    const act = b.dataset.act;
    if (act === 'big') it.s = Math.min(0.6, it.s * 1.25);
    else if (act === 'small') it.s = Math.max(0.1, it.s / 1.25);
    else if (act === 'flip') it.f = it.f ? 0 : 1;
    else if (act === 'del') { items.splice(state.sel, 1); persist(); render(); select(null); refreshTray(); SFX.pop(); return; }
    persist(); SFX.pop();
    const el = scene.querySelector(`.seal[data-i="${state.sel}"]`);
    el.classList.toggle('flip', !!it.f); place(el, it);
  });

  // ---------- しゃしん（背景＋シールを1枚の絵に） ----------
  const shot = document.getElementById('shot');
  document.getElementById('shotBtn').addEventListener('pointerdown', (e) => {
    e.preventDefault(); ensureAudio();
    const r = box(); const dpr = Math.min(2, window.devicePixelRatio || 1);
    const out = document.createElement('canvas'); out.width = Math.round(r.width * dpr); out.height = Math.round(r.height * dpr);
    const c = out.getContext('2d'); c.scale(dpr, dpr);
    c.fillStyle = '#cfe9ff'; c.fillRect(0, 0, r.width, r.height);
    // 背景は object-fit: cover と同じ切り取り
    if (bg.style.display !== 'none' && bg.naturalWidth) {
      const k = Math.max(r.width / bg.naturalWidth, r.height / bg.naturalHeight);
      const w = bg.naturalWidth * k, h = bg.naturalHeight * k;
      c.drawImage(bg, (r.width - w) / 2, (r.height - h) / 2, w, h);
    }
    const u = unit();
    const draws = board().map(it => new Promise(res => {
      const img = new Image(); img.onload = () => res({ img, it }); img.onerror = () => res(null); img.src = `assets/${it.id}.png`;
    }));
    Promise.all(draws).then(list => {
      list.filter(Boolean).forEach(({ img, it }) => {
        const w = it.s * u, h = w * (img.naturalHeight / img.naturalWidth);
        c.save(); c.translate(it.x * r.width, it.y * r.height); if (it.f) c.scale(-1, 1);
        c.drawImage(img, -w / 2, -h / 2, w, h); c.restore();
      });
      shot.querySelector('img').src = out.toDataURL('image/png');
      shot.classList.add('show');
      SFX.correct(); say('しゃしんを とったよ！');
    });
  });
  document.getElementById('shotClose').addEventListener('pointerdown', (e) => { e.preventDefault(); shot.classList.remove('show'); });

  buildTray();
  showScene(d.seal.scene, false);
  Baby.preloadVoice(['すきな シールを はろう！', 'しゃしんを とったよ！', 'もう ないよ']);
  say('すきな シールを はろう！', { delay: 400 });
  setupHome();
})();
</script>
</body>
</html>
