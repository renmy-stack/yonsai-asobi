<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ぬりえ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff3e0">
<link rel="stylesheet" href="common.css?v=202609261644">
<style>
  body { background: linear-gradient(180deg, #fff3e0 0%, #fffaf3 100%); }
  #stage { display: flex; flex-direction: column; gap: 8px; }
  #pics { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; align-content: center; }
  .pic {
    width: 44px; height: 44px; border-radius: 12px; background: #fff;
    box-shadow: 0 3px 0 rgba(0,0,0,.12); padding: 4px;
  }
  .pic img { width: 100%; height: 100%; object-fit: contain; }
  .pic.on { box-shadow: 0 0 0 4px #ff8c42; }
  #paper {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    max-width: 100%; max-height: 100%;
    border-radius: 20px; background: #fff;
    box-shadow: 0 6px 0 rgba(0,0,0,.08);
    touch-action: none;
  }
  .tools { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; align-content: center; }
  .swatch {
    width: 40px; height: 40px; border-radius: 50%;
    border: 4px solid #fff; box-shadow: 0 2px 0 rgba(0,0,0,.15);
    transition: transform .1s;
  }
  .swatch.on { transform: scale(1.25); border-color: #333; }
  .tool {
    height: 40px; padding: 0 12px; border-radius: 20px; border: none;
    background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.15);
    font-size: 17px; font-family: inherit; font-weight: bold; color: #345; touch-action: none;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="pics"></div>
  <div id="paper"><canvas id="cv"></canvas></div>
  <div class="tools" id="colors"></div>
  <div class="tools"><button class="tool" id="reset" type="button">やりなおす（ながおし）</button></div>
</div>

<button id="homeBtn" class="topbtn left" type="button">🏠</button>

<script src="common.js?v=202609261644"></script>
<script>
(() => {
  'use strict';
  const { SFX, say, burst, holdButton, setupHome, ensureAudio, tone } = Baby;
  const PICS = [
    { id: 'dog', name: 'いぬ' }, { id: 'car', name: 'くるま' }, { id: 'apple', name: 'りんご' },
    { id: 'fish', name: 'さかな' }, { id: 'house', name: 'おうち' }, { id: 'flower', name: 'おはな' },
    { id: 'train', name: 'でんしゃ' }, { id: 'cat', name: 'ねこ' }, { id: 'butterfly', name: 'ちょうちょ' },
    { id: 'icecream', name: 'アイス' }, { id: 'rocket', name: 'ロケット' }, { id: 'rabbit', name: 'うさぎ' },
  ];
  const PALETTE = ['#ff5252', '#ff9800', '#ffeb3b', '#8bc34a', '#29b6f6', '#7e57c2', '#f48fb1', '#8d6e63', '#ffffff'];
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const state = { color: PALETTE[0], pic: null, img: null };

  // 絵の選択
  const pics = document.getElementById('pics');
  PICS.forEach(p => {
    const b = document.createElement('div');
    b.className = 'pic'; b.dataset.id = p.id;
    b.innerHTML = `<img src="assets/coloring/${p.id}.png" alt="${p.name}">`;
    pics.appendChild(b);
  });
  pics.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.pic'); if (!b) return;
    e.preventDefault();
    load(PICS.find(p => p.id === b.dataset.id));
  });

  function load(p) {
    state.pic = p;
    [...pics.children].forEach(x => x.classList.toggle('on', x.dataset.id === p.id));
    const img = new Image();
    img.onload = () => {
      state.img = img;
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      fit();
      ctx.drawImage(img, 0, 0);
      say(`${p.name}に いろを ぬろう`);
    };
    img.src = `assets/coloring/${p.id}.png`;
  }
  function fit() {
    const box = document.getElementById('paper').getBoundingClientRect();
    const s = Math.min(box.width / cv.width, box.height / cv.height);
    cv.style.width = `${Math.floor(cv.width * s)}px`;
    cv.style.height = `${Math.floor(cv.height * s)}px`;
  }
  window.addEventListener('resize', fit);

  // パレット
  const colors = document.getElementById('colors');
  PALETTE.forEach(c => {
    const s = document.createElement('div');
    s.className = 'swatch' + (c === state.color ? ' on' : '');
    s.style.background = c; s.dataset.c = c;
    colors.appendChild(s);
  });
  colors.addEventListener('pointerdown', (e) => {
    const s = e.target.closest('.swatch'); if (!s) return;
    e.preventDefault();
    state.color = s.dataset.c;
    [...colors.children].forEach(x => x.classList.toggle('on', x === s));
    SFX.pop();
  });

  // タッチした場所を塗りつぶす（黒い線で止まる）
  function fill(sx, sy, hex) {
    const W = cv.width, H = cv.height;
    const im = ctx.getImageData(0, 0, W, H);
    const d = im.data;
    const idx = (x, y) => (y * W + x) * 4;
    const i0 = idx(sx, sy);
    const isLine = (i) => (d[i] + d[i + 1] + d[i + 2]) / 3 < 110;   // 線（黒っぽい）
    if (isLine(i0)) return false;
    const r0 = d[i0], g0 = d[i0 + 1], b0 = d[i0 + 2];
    const [nr, ng, nb] = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    if (Math.abs(r0 - nr) + Math.abs(g0 - ng) + Math.abs(b0 - nb) < 12) return true;   // すでにその色
    const same = (i) => Math.abs(d[i] - r0) + Math.abs(d[i + 1] - g0) + Math.abs(d[i + 2] - b0) < 90 && !isLine(i);
    const seen = new Uint8Array(W * H);
    const stack = [sx, sy];
    while (stack.length) {
      const y = stack.pop(), x = stack.pop();
      let xl = x;
      while (xl >= 0 && !seen[y * W + xl] && same(idx(xl, y))) xl--;
      xl++;
      let xr = x;
      while (xr < W && !seen[y * W + xr] && same(idx(xr, y))) xr++;
      xr--;
      for (let i = xl; i <= xr; i++) {
        const p = y * W + i;
        seen[p] = 1;
        d[p * 4] = nr; d[p * 4 + 1] = ng; d[p * 4 + 2] = nb; d[p * 4 + 3] = 255;
        if (y > 0 && !seen[(y - 1) * W + i] && same(idx(i, y - 1))) stack.push(i, y - 1);
        if (y < H - 1 && !seen[(y + 1) * W + i] && same(idx(i, y + 1))) stack.push(i, y + 1);
      }
    }
    ctx.putImageData(im, 0, 0);
    return true;
  }

  cv.addEventListener('pointerdown', (e) => {
    if (!state.img) return;
    e.preventDefault();
    ensureAudio();
    const r = cv.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / r.width * cv.width);
    const y = Math.floor((e.clientY - r.top) / r.height * cv.height);
    if (fill(x, y, state.color)) {
      tone({ type: 'sine', f0: 500, f1: 800, dur: 0.15, gain: 0.15 });
      burst(e.clientX, e.clientY, 5);
    } else {
      tone({ type: 'triangle', f0: 300, dur: 0.1, gain: 0.1 });
    }
  });

  holdButton(document.getElementById('reset'), () => {
    if (state.img) { ctx.drawImage(state.img, 0, 0); SFX.pop(); say('やりなおし'); }
  }, 1200);

  setupHome();
  load(PICS[0]);
})();
</script>
</body>
</html>
